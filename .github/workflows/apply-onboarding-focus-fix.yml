name: Apply Onboarding Focus Fix

on:
  push:
    branches: [fix/reward-truth-core]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/reward-truth-core

      - name: Apply focused accessibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/owner-onboarding-wizard-v2.tsx')
          text = path.read_text()

          replacements = [
              (
                  'import { useCallback, useRef, useState } from "react";',
                  'import { useCallback, useEffect, useRef, useState } from "react";',
              ),
              (
                  '  const formRef = useRef<HTMLFormElement>(null);\n  const countrySelectorRef = useRef<CountrySelectorHandle>(null);',
                  '  const formRef = useRef<HTMLFormElement>(null);\n  const countrySelectorRef = useRef<CountrySelectorHandle>(null);\n  const mobileStepHeadingRef = useRef<HTMLHeadingElement>(null);',
              ),
              (
                  '  const selectedCountry = COUNTRY_OPTIONS.find(\n    (option) => option.name === country,\n  );',
                  '  useEffect(() => {\n    const frame = window.requestAnimationFrame(() => {\n      mobileStepHeadingRef.current?.focus({ preventScroll: true });\n      mobileStepHeadingRef.current?.scrollIntoView({\n        behavior: "smooth",\n        block: "start",\n      });\n    });\n\n    return () => window.cancelAnimationFrame(frame);\n  }, [step]);\n\n  const selectedCountry = COUNTRY_OPTIONS.find(\n    (option) => option.name === country,\n  );',
              ),
              (
                  '<h1 className="mt-1 text-xl font-black">{sections[step]}</h1>',
                  '<h1 ref={mobileStepHeadingRef} tabIndex={-1} className="mt-1 text-xl font-black">{sections[step]}</h1>',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/apply-onboarding-focus-fix.yml
          git diff --check

      - name: Commit and push patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/owner-onboarding-wizard-v2.tsx .github/workflows/apply-onboarding-focus-fix.yml
          git commit -m "fix: focus onboarding heading after step transition"
          git push origin HEAD:fix/reward-truth-core
