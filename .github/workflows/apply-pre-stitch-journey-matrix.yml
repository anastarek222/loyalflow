name: Apply pre-stitch browser journey matrix

on:
  push:
    branches: [fix/reward-truth-core]
    paths: [.github/workflows/apply-pre-stitch-journey-matrix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reward-truth-core
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Close browser role/device selection gaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))
              print(f"{label}: updated")

          replace_once(
              "tests/browser/final-uat-u13.spec.ts",
              '  test("manager and viewer remain within their authoritative capabilities @desktop", async ({ page }) => {',
              '  test("manager and viewer remain within their authoritative capabilities @desktop @mobile", async ({ page }) => {',
              "manager/viewer desktop+mobile tags",
          )

          replace_once(
              "tests/browser/final-uat-u13.spec.ts",
              '  test("super admin has explicit global and business context @tablet", async ({ page }) => {',
              '  test("super admin has explicit global and business context @desktop @tablet", async ({ page }) => {',
              "super-admin desktop coverage",
          )

          marker = '''  test("staff operates Scan in Arabic on mobile with branch context and no reports access @mobile", async ({ page }) => {
          '''
          staff_desktop = '''  test("staff operates Scan on desktop with branch context and no reports access @desktop", async ({ page }) => {
            await login(page, "staff-a");
            await page.goto(`/businesses/${fixture.businessA}/scan`);
            await expect(page.locator("#app-content").getByRole("heading", { level: 1 })).toHaveCount(1);
            await openCustomerFromScanSearch(page, "AR");
            const branch = page.getByLabel(/الفرع/);
            await branch.selectOption({ label: "Final UAT A Branch One" });
            await expect(branch).toHaveValue(fixture.staffBranchId);
            await page.getByRole("button", { name: "تسجيل زيارة", exact: true }).click();
            await expect(page).toHaveURL(scanOperationTerminalUrl(fixture.activeCustomer.id), {
              timeout: 15_000,
            });
            await expect(page.getByRole("status")).toBeVisible();
            await page.goto(`/businesses/${fixture.businessA}/reports`);
            await expect(page).toHaveURL(new RegExp(`/businesses/${fixture.businessA}$`));
            await assertAuthenticatedViewportSafety(page);
          });

          '''
          replace_once(
              "tests/browser/final-uat-u13.spec.ts",
              marker,
              staff_desktop + marker,
              "staff desktop journey",
          )

          customer_marker = '''  test("public enrollment and English/Arabic public cards are responsive and private @mobile", async ({ page }) => {
          '''
          customer_desktop = '''  test("customer can join and use the public card on desktop @desktop", async ({ page }) => {
            await page.goto(`/join/${fixture.businessA}`);
            await expect(page.locator("main")).toHaveAttribute("dir", "ltr");
            await page.getByLabel("First name").fill("Desktop Browser UAT");
            await page.getByLabel("Phone number").fill(fixture.publicEnrollmentPhone);
            await page.getByRole("button", { name: "Create digital card", exact: true }).click();
            await expect(page).toHaveURL(/\/card\/[^/?#]+\?welcome=1$/, {
              timeout: 20_000,
            });
            const actions = page.getByRole("region", { name: "Share card", exact: true });
            await expect(actions.getByRole("button", { name: "Share card", exact: true })).toBeVisible();
            await expect(actions.getByRole("button", { name: "Copy link", exact: true })).toBeVisible();
            await expect(actions.getByRole("button", { name: "Add to Home Screen", exact: true })).toBeVisible();
            await expect(page.getByText(/Private final UAT fixture note/)).toHaveCount(0);
            await assertViewportSafety(page);

            await page.goto(`/card/${fixture.activeCustomer.publicToken}`);
            await expect(page.getByText("Final UAT active", { exact: true })).toBeVisible();
            await expect(page.getByRole("img", { name: /loyalty card front/i })).toBeVisible();
            await expect(page.getByText(/Private final UAT fixture note/)).toHaveCount(0);
            await assertViewportSafety(page);
          });

          '''
          replace_once(
              "tests/browser/final-uat-u13.spec.ts",
              customer_marker,
              customer_desktop + customer_marker,
              "customer desktop journey",
          )

          replace_once(
              "tests/browser/owner-onboarding-mobile.spec.ts",
              '  test("public Trial request sends a secure email link once and launches a persisted 14-day Trial", async ({',
              '  test("public Trial request sends a secure email link once and launches a persisted 14-day Trial @owner-onboarding-desktop", async ({',
              "owner acquisition desktop tag",
          )

          config_marker = '''    {
              name: "owner-onboarding-chromium",
              grep: /@owner-onboarding/,
              use: { browserName: "chromium", viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
            },
          '''
          config_replacement = config_marker + '''    {
              name: "owner-onboarding-desktop",
              grep: /@owner-onboarding-desktop/,
              use: { browserName: "chromium", viewport: { width: 1440, height: 900 } },
            },
          '''
          replace_once(
              "playwright.config.ts",
              config_marker,
              config_replacement,
              "owner desktop Playwright project",
          )

          workflow_old = '''          if [[ "${{ steps.browser-smoke.outputs.owner-onboarding }}" == "true" ]]; then
            pnpm exec playwright test tests/browser/owner-onboarding-mobile.spec.ts --config=playwright.config.ts --project=owner-onboarding-chromium
          fi
          '''
          workflow_new = '''          if [[ "${{ steps.browser-smoke.outputs.owner-onboarding }}" == "true" ]]; then
            pnpm exec playwright test tests/browser/owner-onboarding-mobile.spec.ts --config=playwright.config.ts --project=owner-onboarding-chromium
            pnpm exec playwright test tests/browser/owner-onboarding-mobile.spec.ts --config=playwright.config.ts --project=owner-onboarding-desktop
          fi
          '''
          replace_once(
              ".github/workflows/staging-pr-validation.yml",
              workflow_old,
              workflow_new,
              "owner desktop CI receipt",
          )

          contract = Path("tests/pilot-owner-onboarding-receipt.test.ts")
          text = contract.read_text()
          old = '  assert.match(workflow, /--project=owner-onboarding-chromium/);\n'
          new = old + '  assert.match(workflow, /--project=owner-onboarding-desktop/);\n'
          if text.count(old) != 1:
              raise SystemExit("owner receipt project assertion not found")
          contract.write_text(text.replace(old, new, 1))

          journey_contract = Path("tests/pre-stitch-browser-journey-matrix.test.ts")
          if journey_contract.exists():
              raise SystemExit("journey matrix contract already exists")
          journey_contract.write_text('''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const source = (path: string) => readFileSync(path, "utf8");
          const finalUat = source("tests/browser/final-uat-u13.spec.ts");
          const ownerUat = source("tests/browser/owner-onboarding-mobile.spec.ts");
          const config = source("playwright.config.ts");
          const workflow = source(".github/workflows/staging-pr-validation.yml");

          test("pre-Stitch browser receipts select every required non-WhatsApp role across desktop/mobile functional scopes", () => {
            assert.match(finalUat, /manager and viewer remain within their authoritative capabilities @desktop @mobile/);
            assert.match(finalUat, /super admin has explicit global and business context @desktop @tablet/);
            assert.match(finalUat, /staff operates Scan on desktop with branch context and no reports access @desktop/);
            assert.match(finalUat, /staff operates Scan in Arabic on mobile with branch context and no reports access @mobile/);
            assert.match(finalUat, /customer can join and use the public card on desktop @desktop/);
            assert.match(finalUat, /public enrollment and English\/Arabic public cards are responsive and private @mobile/);
          });

          test("Owner Trial acquisition has an explicit desktop receipt in addition to the mobile onboarding receipt", () => {
            assert.match(ownerUat, /14-day Trial @owner-onboarding-desktop/);
            assert.match(config, /name: "owner-onboarding-desktop"/);
            assert.match(config, /grep: \/@owner-onboarding-desktop\//);
            assert.match(workflow, /--project=owner-onboarding-chromium/);
            assert.match(workflow, /--project=owner-onboarding-desktop/);
          });
          ''')
          PY

          pnpm exec prettier --write \
            tests/browser/final-uat-u13.spec.ts \
            tests/browser/owner-onboarding-mobile.spec.ts \
            playwright.config.ts \
            .github/workflows/staging-pr-validation.yml \
            tests/pilot-owner-onboarding-receipt.test.ts \
            tests/pre-stitch-browser-journey-matrix.test.ts

          git diff --check
          pnpm exec eslint \
            tests/browser/final-uat-u13.spec.ts \
            tests/browser/owner-onboarding-mobile.spec.ts \
            playwright.config.ts \
            tests/pilot-owner-onboarding-receipt.test.ts \
            tests/pre-stitch-browser-journey-matrix.test.ts
          node --import tsx --test \
            tests/pilot-owner-onboarding-receipt.test.ts \
            tests/pre-stitch-browser-journey-matrix.test.ts
          pnpm exec playwright test tests/browser/final-uat-u13.spec.ts --config=playwright.config.ts --project=desktop-chromium --list
          pnpm exec playwright test tests/browser/final-uat-u13.spec.ts --config=playwright.config.ts --project=mobile-chromium --list
          pnpm exec playwright test tests/browser/owner-onboarding-mobile.spec.ts --config=playwright.config.ts --project=owner-onboarding-desktop --list

      - name: Commit scoped journey matrix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pre-stitch-journey-matrix.yml
          git add \
            tests/browser/final-uat-u13.spec.ts \
            tests/browser/owner-onboarding-mobile.spec.ts \
            playwright.config.ts \
            .github/workflows/staging-pr-validation.yml \
            tests/pilot-owner-onboarding-receipt.test.ts \
            tests/pre-stitch-browser-journey-matrix.test.ts
          git commit -m "test: close pre-stitch browser journey matrix"
          git push origin HEAD:fix/reward-truth-core
