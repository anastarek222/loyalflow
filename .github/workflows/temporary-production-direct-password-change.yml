name: Temporary Production Rotated Login Certification V6

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  certify-new-login:
    if: github.event.pull_request.head.ref == 'ops/production-direct-password-change-340'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PRODUCTION_SHA: 988f569e6cc0763789680d15a50f641da07f8e42
      PRODUCTION_ORIGIN: https://loyalflow-gray.vercel.app
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Guard exact Production source authority
        shell: bash
        run: |
          set -euo pipefail
          actual_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual_main" = "$EXPECTED_PRODUCTION_SHA"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_PRODUCTION_SHA"
          echo "PRODUCTION_SOURCE_GATE=exact-main"

      - name: Create ephemeral encrypted handoff channel V6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/handoff-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/handoff-private.pem" -pubout -outform DER -out "$RUNNER_TEMP/handoff-public.der" 2>/dev/null
          pub="$(base64 -w0 "$RUNNER_TEMP/handoff-public.der")"
          gh pr comment "$PR_NUMBER" --body "HANDOFF_PUBLIC_KEY_DER_B64_V6=$pub"
          echo "HANDOFF_CHANNEL_V6=ready"

      - name: Set up pnpm and browser
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Receive encrypted owner handoff V6
        shell: bash
        run: |
          set -euo pipefail
          cipher=""
          for _ in $(seq 1 120); do
            body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"
            cipher="$(printf '%s\n' "$body" | sed -n 's/^HANDOFF_RSA_OAEP_SHA256_V6=//p' | head -n1)"
            if [ -n "$cipher" ]; then break; fi
            sleep 5
          done
          test -n "$cipher"
          printf '%s' "$cipher" | base64 -d > "$RUNNER_TEMP/handoff.bin"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/handoff-private.pem" \
            -in "$RUNNER_TEMP/handoff.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "$RUNNER_TEMP/handoff.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/handoff.json', 'utf8'));
          for (const key of ['email','newPassword','totpSecret']) {
            if (typeof p[key] !== 'string' || !p[key]) throw new Error(`missing ${key}`);
            console.log(`::add-mask::${p[key]}`);
          }
          console.log('HANDOFF_DECRYPTION_V6=valid');
          NODE

      - name: Certify replacement credential through MFA to dashboard
        shell: bash
        run: |
          set -euo pipefail
          cat > .temporary-production-new-login-cert-v6.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from '@playwright/test';

          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/handoff.json', 'utf8'));
          const origin = process.env.PRODUCTION_ORIGIN;

          function decodeBase32(input) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            const normalized = input.toUpperCase().replace(/=+$/g, '').replace(/\s+/g, '');
            let bits = '';
            for (const ch of normalized) {
              const idx = alphabet.indexOf(ch);
              if (idx < 0) throw new Error('invalid base32 secret');
              bits += idx.toString(2).padStart(5, '0');
            }
            const bytes = [];
            for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
            return Buffer.from(bytes);
          }

          function totp(secret) {
            const counter = Math.floor(Date.now() / 1000 / 30);
            const buf = Buffer.alloc(8);
            buf.writeBigUInt64BE(BigInt(counter));
            const h = crypto.createHmac('sha1', decodeBase32(secret)).update(buf).digest();
            const offset = h[h.length - 1] & 0x0f;
            const bin = ((h[offset] & 0x7f) << 24) | ((h[offset + 1] & 0xff) << 16) | ((h[offset + 2] & 0xff) << 8) | (h[offset + 3] & 0xff);
            return String(bin % 1_000_000).padStart(6, '0');
          }

          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext();
            const page = await context.newPage();
            const live = await context.request.get(origin + '/api/health/live');
            const ready = await context.request.get(origin + '/api/health');
            if (!live.ok() || !ready.ok()) throw new Error(`health failed live=${live.status()} ready=${ready.status()}`);
            console.log('PRODUCTION_HEALTH=ready');

            await page.goto(origin + '/login', { waitUntil: 'domcontentloaded' });
            const primaryForm = page.locator('form:has(#email):has(#password)');
            await primaryForm.locator('#email').fill(payload.email);
            await primaryForm.locator('#password').fill(payload.newPassword);
            await primaryForm.locator('button[type="submit"]').click();
            await page.locator('[data-testid="login-mfa-step"]').waitFor({ state: 'visible', timeout: 20000 });
            console.log('NEW_CREDENTIAL_PRIMARY_LOGIN=mfa-required');

            const mfaForm = page.locator('form:has(#mfaCode)');
            const emailLength = await mfaForm.locator('input[name="email"]').inputValue().then(v => v.length);
            const passwordLength = await mfaForm.locator('input[name="password"]').inputValue().then(v => v.length);
            const loginStep = await mfaForm.locator('input[name="loginStep"]').inputValue();
            if (emailLength < 3 || passwordLength < 10 || loginStep !== 'mfa') {
              throw new Error(`mfa form continuity invalid emailLength=${emailLength} passwordLength=${passwordLength} loginStep=${loginStep}`);
            }
            console.log(`MFA_FORM_CONTINUITY=valid emailLength=${emailLength} passwordLength=${passwordLength} loginStep=${loginStep}`);

            const phase = Date.now() % 30000;
            if (phase > 24000) await page.waitForTimeout(30000 - phase + 1200);
            await mfaForm.locator('#mfaCode').fill(totp(payload.totpSecret));
            await mfaForm.locator('button[type="submit"]').click();

            const deadline = Date.now() + 25000;
            while (Date.now() < deadline) {
              const url = new URL(page.url());
              if (url.pathname.startsWith('/dashboard')) {
                console.log('NEW_CREDENTIAL_MFA_LOGIN=dashboard');
                console.log('PASSWORD_ROTATION_CERTIFICATION=pass');
                process.exit(0);
              }
              if (await page.locator('[data-testid="login-service-unavailable"]').isVisible().catch(() => false)) {
                console.log('NEW_CREDENTIAL_MFA_LOGIN=service-unavailable');
                process.exit(2);
              }
              const step = page.locator('[data-testid="login-mfa-step"]');
              if (await step.isVisible().catch(() => false)) {
                const alertVisible = await step.locator('[role="alert"]').isVisible().catch(() => false);
                if (alertVisible) {
                  console.log('NEW_CREDENTIAL_MFA_LOGIN=mfa-invalid');
                  process.exit(2);
                }
              }
              await page.waitForTimeout(250);
            }
            throw new Error(`MFA completion timed out at ${new URL(page.url()).pathname}`);
          } finally {
            await browser.close();
          }
          NODE
          node .temporary-production-new-login-cert-v6.mjs

      - name: Cleanup runner-local private material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/handoff-private.pem" \
            "$RUNNER_TEMP/handoff-public.der" \
            "$RUNNER_TEMP/handoff.bin" \
            "$RUNNER_TEMP/handoff.json" \
            .temporary-production-new-login-cert-v6.mjs
          echo "RUNNER_PRIVATE_MATERIAL_CLEANUP=done"
