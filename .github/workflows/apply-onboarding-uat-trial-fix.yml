name: Apply Onboarding UAT Trial Fix

on:
  push:
    branches: [fix/reward-truth-core]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/reward-truth-core

      - name: Align onboarding UAT and trial copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/browser/owner-onboarding-mobile.spec.ts')
          test_text = test_path.read_text()
          test_replacements = [
              (
                  'import { expect, test } from "@playwright/test";\n\nimport { PrismaClient }',
                  'import { expect, test } from "@playwright/test";\nimport { TRIAL_DURATION_DAYS } from "@loyalflow/domain/billing/trial-core";\n\nimport { PrismaClient }',
              ),
              (
                  'for (const step of [3, 4, 5, 6]) {',
                  'for (const step of [3, 4]) {',
              ),
              (
                  'public Trial request sends a secure email link once and launches a persisted seven-day Trial',
                  'public Trial request sends a secure email link once and launches a persisted 14-day Trial',
              ),
              (
                  'expect(deliveredEmail.text).toContain("seven-day trial starts");',
                  'expect(deliveredEmail.text).toContain(`${TRIAL_DURATION_DAYS}-day trial starts`);',
              ),
              (
                  'for (const step of [2, 3, 4, 5, 6]) {',
                  'for (const step of [2, 3, 4]) {',
              ),
              (
                  ').toBe(7 * 24 * 60 * 60 * 1000);',
                  ').toBe(TRIAL_DURATION_DAYS * 24 * 60 * 60 * 1000);',
              ),
          ]
          for old, new in test_replacements:
              count = test_text.count(old)
              if count != 1:
                  raise SystemExit(f'test replacement expected once, got {count}: {old[:100]!r}')
              test_text = test_text.replace(old, new, 1)
          test_path.write_text(test_text)

          email_path = Path('lib/auth/owner-invitation-email.ts')
          email_text = email_path.read_text()
          email_replacements = [
              (
                  'import { TANEE_AUTH_EMAIL_BRAND } from "@/lib/auth/auth-email-sender";',
                  'import { TRIAL_DURATION_DAYS } from "@loyalflow/domain/billing/trial-core";\n\nimport { TANEE_AUTH_EMAIL_BRAND } from "@/lib/auth/auth-email-sender";',
              ),
              (
                  'Your seven-day trial starts when you complete this secure step.',
                  'Your ${TRIAL_DURATION_DAYS}-day trial starts when you complete this secure step.',
              ),
          ]
          for old, new in email_replacements:
              count = email_text.count(old)
              if count != 2 if old.startswith('Your seven-day') else count != 1:
                  raise SystemExit(f'email replacement count mismatch {count}: {old!r}')
              email_text = email_text.replace(old, new)
          email_path.write_text(email_text)
          PY

          rm .github/workflows/apply-onboarding-uat-trial-fix.yml
          git diff --check

      - name: Commit and push patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/owner-onboarding-mobile.spec.ts lib/auth/owner-invitation-email.ts .github/workflows/apply-onboarding-uat-trial-fix.yml
          git commit -m "fix: align onboarding UAT with four-step fourteen-day trial"
          git push origin HEAD:fix/reward-truth-core
