name: Temporary unit-name wizard limit patch

on:
  push:
    branches:
      - fix/unit-name-wizard-limit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unit-name-wizard-limit

      - name: Apply bounded unit-name patch
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          targets = [
              Path("components/owner-onboarding-wizard.tsx"),
              Path("components/business-setup-wizard.tsx"),
          ]
          import_marker = 'import { StandardCardSetup } from "@/components/standard-card-setup";\n'
          import_line = 'import { STANDARD_CARD_UNIT_LABEL_MAX_LENGTH } from "@/lib/cards/standard-card-text";\n'
          unit_pattern = re.compile(r'(name="unitName"[\s\S]{0,240}?maxLength=)\{30\}')

          for path in targets:
              source = path.read_text(encoding="utf-8")
              if source.count(import_marker) != 1:
                  raise SystemExit(f"unexpected StandardCardSetup import count in {path}")
              if import_line not in source:
                  source = source.replace(import_marker, import_marker + import_line, 1)
              source, replaced = unit_pattern.subn(
                  lambda match: f'{match.group(1)}{{STANDARD_CARD_UNIT_LABEL_MAX_LENGTH}}',
                  source,
                  count=1,
              )
              if replaced != 1:
                  raise SystemExit(f"expected exactly one unitName maxLength=30 in {path}, got {replaced}")
              path.write_text(source, encoding="utf-8")

          workflow = Path(".github/workflows/tmp-unit-name-limit.yml")
          workflow.unlink()
          PY

      - name: Verify bounded diff
        run: git diff --check

      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/owner-onboarding-wizard.tsx components/business-setup-wizard.tsx .github/workflows/tmp-unit-name-limit.yml
          git commit -m "fix: align unit name wizard limit"
          git push origin HEAD:fix/unit-name-wizard-limit
