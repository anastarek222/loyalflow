name: Temporary Phase H Fixture Diagnostic

on:
  push:
    branches:
      - agent/phase-h-fixture-diagnostic-f85b4f5a

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  fixture-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TARGET_SHA: f85b4f5abcd3ef6c129c5f23826c349de69f1025
      STAGING_UAT_BASE_URL: https://loyalflow-dhv01bm8y-anas-tarek.vercel.app
      LOYALFLOW_ENVIRONMENT: staging
      LOYALFLOW_STAGING_DATABASE: neondb
      LOYALFLOW_STAGING_DATABASE_HOST: ep-steep-bar-au02osd6-pooler.c-10.us-east-1.aws.neon.tech
      LOYALFLOW_PRODUCTION_DATABASE_HOST: ep-crimson-moon-au6bcbh1.c-10.us-east-1.aws.neon.tech
      LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
      PR_NUMBER: "549"
    steps:
      - name: Generate ephemeral handoff key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase-h-handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/phase-h-handoff/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/phase-h-handoff/private.pem -pubout -out /tmp/phase-h-handoff/public.pem

      - name: Publish public handoff key artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-fixture-diagnostic-handoff-${{ github.run_id }}
          path: /tmp/phase-h-handoff/public.pem
          retention-days: 1

      - name: Wait for encrypted handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="phase-h-fixture-diagnostic-handoff:${GITHUB_RUN_ID}:"
          request_id="$GITHUB_RUN_ID"
          for attempt in $(seq 1 180); do
            body=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -r --arg prefix "$prefix" '[.[] | .body | select(startswith($prefix))] | last // empty')
            if [ -n "$body" ]; then
              encoded="${body#${prefix}}"
              printf '%s' "$encoded" | base64 -d > /tmp/phase-h-handoff/payload.json
              if jq -e --arg requestId "$request_id" '.requestId == $requestId' /tmp/phase-h-handoff/payload.json >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::Encrypted Phase H handoff was not received"
          exit 1

      - name: Decrypt ephemeral handoff
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const payload = JSON.parse(fs.readFileSync('/tmp/phase-h-handoff/payload.json', 'utf8'));
          const privateKey = fs.readFileSync('/tmp/phase-h-handoff/private.pem', 'utf8');
          const key = crypto.privateDecrypt(
            { key: privateKey, oaepHash: 'sha256', padding: crypto.constants.RSA_PKCS1_OAEP_PADDING },
            Buffer.from(payload.key, 'base64'),
          );
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(payload.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(payload.tag, 'base64'));
          const clear = Buffer.concat([
            decipher.update(Buffer.from(payload.data, 'base64')),
            decipher.final(),
          ]);
          const values = JSON.parse(clear.toString('utf8'));
          for (const name of ['DATABASE_URL', 'UAT_FIXTURE_PASSWORD']) {
            if (!values[name]) throw new Error(`${name} missing from encrypted handoff`);
            process.stdout.write(`::add-mask::${values[name]}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<PHUATEOF\n${values[name]}\nPHUATEOF\n`);
          }
          NODE
          rm -f /tmp/phase-h-handoff/payload.json /tmp/phase-h-handoff/private.pem

      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run official fixture preparation diagnostic
        id: prepare
        shell: bash
        run: |
          set -uo pipefail
          manifest=/tmp/phase-h-fixture-diagnostic.json
          raw=/tmp/phase-h-fixture-prepare.raw.log
          safe=/tmp/phase-h-fixture-prepare.safe.log
          set +e
          npm run prepare:final-uat -- --base-url="$STAGING_UAT_BASE_URL" --manifest="$manifest" >"$raw" 2>&1
          code=$?
          set -e
          python - <<'PY'
          import os
          from pathlib import Path
          raw = Path('/tmp/phase-h-fixture-prepare.raw.log').read_text(errors='replace')
          for secret in [os.environ.get('DATABASE_URL',''), os.environ.get('UAT_FIXTURE_PASSWORD','')]:
              if secret:
                  raw = raw.replace(secret, '[REDACTED]')
          Path('/tmp/phase-h-fixture-prepare.safe.log').write_text(raw)
          PY
          rm -f "$raw"
          cat "$safe"
          echo "prepare_exit=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$manifest" ]; then
            run_id=$(jq -r '.runId // empty' "$manifest")
            if [ -n "$run_id" ]; then echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; fi
          fi
          exit 0

      - name: Official cleanup if manifest exists
        if: always() && steps.prepare.outputs.run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          npm run cleanup:final-uat -- --cleanup="${{ steps.prepare.outputs.run_id }}"

      - name: Verify final UAT fixture count is zero
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const result = await client.query('SELECT count(*)::int AS count FROM "Business" WHERE name LIKE $1 OR slug LIKE $2 OR slug LIKE $3', ['LoyalFlow final UAT %','lf-uat-final-%','loyalflow-final-uat-o-%']);
          await client.end();
          const count = result.rows[0]?.count ?? -1;
          console.log(`FINAL_UAT_FIXTURE_COUNT=${count}`);
          if (count !== 0) throw new Error(`Final UAT fixture cleanup incomplete: ${count} businesses remain`);
          NODE

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-fixture-diagnostic-${{ github.run_id }}
          path: /tmp/phase-h-fixture-prepare.safe.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Classify fixture preparation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="${{ steps.prepare.outputs.prepare_exit }}"
          echo "FIXTURE_PREPARE_EXIT_CODE=${code:-missing}"
          test "${code:-1}" -eq 0
