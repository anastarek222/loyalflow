name: Production PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loyalflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loyalflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loyalflow_ci?schema=public
      AUTH_SECRET: production-pr-ci-only-auth-secret-not-for-runtime-0123456789abcdef
      NEXT_PUBLIC_APP_URL: https://gettanee.com
      NEXT_PUBLIC_SITE_URL: https://gettanee.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect browser smoke scope
        id: browser-smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}..HEAD" > /tmp/loyalflow-pr-files.txt
          if grep -Eq '^(app/|components/|lib/(auth|server/auth)|tests/browser/|playwright\.config\.ts$|\.github/workflows/production-pr-validation\.yml$)' /tmp/loyalflow-pr-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(app/(onboarding|accept-owner-invitation)/|lib/auth/owner-invitation(?:-runtime)?\.ts$|tests/browser/owner-invitation-trial\.spec\.ts$|\.github/workflows/production-pr-validation\.yml$)' /tmp/loyalflow-pr-files.txt; then
            echo "owner-invitation=true" >> "$GITHUB_OUTPUT"
          else
            echo "owner-invitation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused subscription entitlement tests
        run: node --import tsx --test tests/subscription-lifecycle.test.ts tests/tc4*.test.ts

      - name: Run full tests
        run: pnpm test

      - name: Type-check project
        run: pnpm run typecheck

      - name: Validate workspace boundaries
        run: pnpm run validate:workspace

      - name: Lint project
        run: pnpm run lint

      - name: Build application
        run: pnpm run build

      - name: Apply disposable browser smoke migrations
        if: steps.browser-smoke.outputs.run == 'true'
        run: pnpm exec prisma migrate deploy

      - name: Install Chromium for browser smoke
        if: steps.browser-smoke.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke
        if: steps.browser-smoke.outputs.run == 'true'
        env:
          LOYALFLOW_ENVIRONMENT: staging
          LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
          LOYALFLOW_STAGING_DATABASE: loyalflow_ci
          LOYALFLOW_STAGING_DATABASE_HOST: 127.0.0.1
          LOYALFLOW_PRODUCTION_DATABASE_HOST: production-db.invalid
          UAT_FIXTURE_PASSWORD: browser-smoke-only-password-2026
          UAT_BASE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          AUTH_URL: http://127.0.0.1:3100
          AUTH_TRUST_HOST: "true"
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:3199
          UPSTASH_REDIS_REST_TOKEN: browser-smoke-rate-limit-token
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-rate-limit-server.mjs &
          rate_limit_pid=$!
          trap 'kill "$rate_limit_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3199/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "Disposable rate-limit server did not become ready." >&2
              exit 1
            fi
            sleep 0.25
          done
          pnpm exec playwright test tests/browser/pr-smoke.spec.ts --config=playwright.config.ts --project=desktop-chromium
          if [[ "${{ steps.browser-smoke.outputs.owner-invitation }}" == "true" ]]; then
            pnpm exec playwright test tests/browser/owner-invitation-trial.spec.ts --config=playwright.config.ts --project=owner-onboarding-chromium
          fi

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
