name: Temporary Phase H Secret Presence Probe

on:
  push:
    branches:
      - agent/phase-h-secret-presence-probe-f85b4f5

permissions:
  contents: read

jobs:
  secret-presence:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET_CANDIDATE: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET_CANDIDATE: ${{ secrets.NEXTAUTH_SECRET }}
    steps:
      - name: Report root-secret availability without revealing values
        shell: bash
        run: |
          set -euo pipefail
          auth_present=NO
          nextauth_present=NO
          [ -n "${AUTH_SECRET_CANDIDATE:-}" ] && auth_present=YES
          [ -n "${NEXTAUTH_SECRET_CANDIDATE:-}" ] && nextauth_present=YES
          echo "AUTH_SECRET_PRESENT=$auth_present"
          echo "NEXTAUTH_SECRET_PRESENT=$nextauth_present"
          if [ "$auth_present" = NO ] && [ "$nextauth_present" = NO ]; then
            echo "::error::No existing GitHub Actions MFA root secret is available"
            exit 1
          fi
