name: Temporary Phase H AUTH_SECRET Presence

on:
  push:
    branches:
      - agent/phase-h-runtime-uat-5c0c7164

permissions:
  contents: read

jobs:
  check-auth-secret:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - name: Verify existing Actions AUTH_SECRET is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUTH_SECRET:-}" ]; then
            echo "AUTH_SECRET_PRESENT=NO"
            exit 1
          fi
          echo "::add-mask::$AUTH_SECRET"
          echo "AUTH_SECRET_PRESENT=YES"
          echo "AUTH_SECRET_LENGTH_OK=$([ ${#AUTH_SECRET} -ge 32 ] && echo YES || echo NO)"
