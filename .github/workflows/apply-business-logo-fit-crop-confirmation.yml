name: Apply Business Logo Fit Crop Confirmation

on:
  push:
    branches:
      - fix/business-logo-fit-crop-confirmation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/business-logo-fit-crop-confirmation
          fetch-depth: 0

      - name: Apply bounded Business logo crop patch
        env:
          PATCH_SCRIPT_B64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/apply-logo-fit-crop.py
          python /tmp/apply-logo-fit-crop.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit bounded patch and remove helper workflow
        run: |
          rm .github/workflows/apply-business-logo-fit-crop-confirmation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business-setup-wizard.tsx app/businesses/actions.ts .github/workflows/apply-business-logo-fit-crop-confirmation.yml
          git commit -m "fix: require confirmed square business logo output"
          git push origin HEAD:fix/business-logo-fit-crop-confirmation
