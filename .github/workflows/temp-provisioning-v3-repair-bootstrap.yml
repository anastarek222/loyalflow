name: Temporary Provisioning V3 Repair Bootstrap

on:
  pull_request:
    branches: [staging]
    types: [synchronize]
    paths:
      - .github/workflows/temp-provisioning-v3-repair-bootstrap.yml

permissions:
  contents: write

jobs:
  repair-v3-receipt:
    if: github.head_ref == 'ops/pilot-provisioning-runtime-v3-340'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/pilot-provisioning-runtime-v3-340
          fetch-depth: 0
      - name: Repair V3 harness and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/temp-pilot-provisioning-runtime-v3.yml')
          s = p.read_text()
          s2 = s.replace('types: [opened]', 'types: [opened, synchronize]', 1)
          old = 'await page.getByRole("button", { name: "Verify", exact: true }).press("Enter");'
          new = 'await page.locator(\'button[type="submit"]\').click();'
          if old not in s2:
              raise SystemExit('expected MFA locator not found')
          s2 = s2.replace(old, new, 1)
          p.write_text(s2)
          PY
          rm -f .github/workflows/temp-provisioning-v3-repair-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ops(test): repair provisioning v3 MFA receipt [skip ci]"
          git push origin HEAD:ops/pilot-provisioning-runtime-v3-340
