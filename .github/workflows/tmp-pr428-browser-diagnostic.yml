name: PR 428 Browser Diagnostic

on:
  pull_request:
    branches: [fix/public-join-brand-theme-safety]

permissions:
  contents: read

concurrency:
  group: pr428-browser-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose manager/viewer boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loyalflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loyalflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loyalflow_ci?schema=public
      AUTH_SECRET: staging-pr-ci-only-auth-secret-not-for-runtime-0123456789abcdef
      LOYALFLOW_ENVIRONMENT: staging
      LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
      LOYALFLOW_STAGING_DATABASE: loyalflow_ci
      LOYALFLOW_STAGING_DATABASE_HOST: 127.0.0.1
      LOYALFLOW_PRODUCTION_DATABASE_HOST: production-db.invalid
      UAT_FIXTURE_PASSWORD: browser-smoke-only-password-2026
      UAT_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply disposable browser smoke migrations
        run: pnpm exec prisma migrate deploy

      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Run manager boundary
        run: pnpm exec playwright test tests/browser/tmp-pr428-role-boundaries.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "manager boundary"

      - name: Run viewer boundary
        if: success() || failure()
        run: pnpm exec playwright test tests/browser/tmp-pr428-role-boundaries.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "viewer boundary"
