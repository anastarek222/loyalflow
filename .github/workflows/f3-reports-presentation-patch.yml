name: F3 Reports presentation patch

on:
  push:
    branches:
      - final-product/f3-reports-presentation-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-product/f3-reports-presentation-parity
          fetch-depth: 0
      - name: Apply bounded Reports presentation patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/businesses/[slug]/reports/page.tsx')
          source = path.read_text()

          def replace_exact(old: str, new: str, expected: int | None = 1):
              global source
              count = source.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'Expected {expected} matches, found {count}: {old[:100]!r}')
              if expected is None and count == 0:
                  raise SystemExit(f'Expected at least one match: {old[:100]!r}')
              source = source.replace(old, new)

          replace_exact(
              'const dateTimeFormatter = new Intl.DateTimeFormat("ar-EG", {\n  dateStyle: "medium",\n  timeStyle: "short",\n});\n\n',
              '',
          )
          replace_exact(
              '  const numberFormatter = new Intl.NumberFormat(getLanguageLocale(language));\n',
              '  const numberFormatter = new Intl.NumberFormat(getLanguageLocale(language));\n'
              '  const dateTimeFormatter = new Intl.DateTimeFormat(getLanguageLocale(language), {\n'
              '    dateStyle: "medium",\n'
              '    timeStyle: "short",\n'
              '  });\n',
          )

          replace_exact(
              'className="mb-2 block text-sm font-medium text-slate-700"',
              'className="mb-2 block text-sm font-medium text-foreground-muted"',
              6,
          )
          replace_exact('bg-primary px-5 font-bold text-white transition-colors', 'bg-primary px-5 font-bold text-primary-foreground transition-colors')
          replace_exact('border-primary bg-primary text-white', 'border-primary bg-primary text-primary-foreground')

          for old, new in [
              ('rounded-2xl bg-white p-5 shadow-sm sm:p-6', 'rounded-[var(--lf-radius-card)] border border-border bg-surface p-5 shadow-sm sm:p-6'),
              ('rounded-3xl border border-slate-200 bg-white p-5 shadow-sm', 'rounded-[var(--lf-radius-card)] border border-border bg-surface p-5 shadow-sm'),
              ('overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm', 'overflow-hidden rounded-[var(--lf-radius-card)] border border-border bg-surface shadow-sm'),
              ('h-fit rounded-3xl border border-slate-200 bg-white p-6 shadow-sm', 'h-fit rounded-[var(--lf-radius-card)] border border-border bg-surface p-6 shadow-sm'),
              ('text-sm text-slate-500', 'text-sm text-foreground-muted'),
              ('text-xs text-slate-400', 'text-xs text-foreground-subtle'),
              ('text-4xl font-bold text-slate-950', 'lf-type-numeric text-4xl font-bold text-foreground'),
              ('text-lg font-bold text-slate-950', 'text-lg font-bold text-foreground'),
              ('text-xl font-bold text-slate-950', 'text-xl font-bold text-foreground'),
              ('font-semibold text-slate-950 hover:text-violet-700', 'font-semibold text-foreground hover:text-primary'),
              ('font-semibold text-slate-950', 'font-semibold text-foreground'),
              ('text-violet-700', 'text-primary'),
              ('border-slate-200', 'border-border'),
              ('divide-slate-100', 'divide-border'),
              ('hover:bg-slate-50', 'hover:bg-surface-subtle'),
              ('bg-slate-50', 'bg-surface-subtle'),
              ('text-slate-700', 'text-foreground-muted'),
              ('text-slate-600', 'text-foreground-muted'),
              ('bg-slate-100', 'bg-surface-subtle'),
              ('bg-slate-950 text-xs font-bold text-white', 'bg-foreground text-xs font-bold text-background'),
              ('bg-slate-950 font-bold text-white', 'bg-foreground font-bold text-background'),
              ('hover:border-violet-300 hover:bg-violet-50', 'hover:border-primary/30 hover:bg-primary-soft'),
          ]:
              if old in source:
                  source = source.replace(old, new)

          replace_exact(
              'rounded-3xl border border-border bg-slate-950 p-5 text-white shadow-sm sm:p-7',
              'rounded-[var(--lf-radius-card)] border border-border bg-foreground p-5 text-background shadow-sm sm:p-7',
          )
          source = source.replace('text-slate-300', 'text-background/70')
          source = source.replace('bg-white/10', 'bg-background/10')
          source = source.replace('text-white', 'text-background')

          replacements = {
              '<p className="text-sm text-foreground-muted">إجمالي العملاء</p>': '<p className="text-sm text-foreground-muted">{copy.totalCustomers}</p>',
              '<p className="text-sm text-foreground-muted">العملاء الجدد</p>': '<p className="text-sm text-foreground-muted">{copy.newCustomers}</p>',
              '<p className="text-sm text-foreground-muted">العملاء النشطون</p>': '<p className="text-sm text-foreground-muted">{copy.activeCustomers}</p>',
              '<p className="text-sm text-foreground-muted">العملاء غير النشطين</p>': '<p className="text-sm text-foreground-muted">{copy.inactiveCustomers}</p>',
              '<p className="text-sm text-foreground-muted">عملاء معرّضون للتوقف</p>': '<p className="text-sm text-foreground-muted">{copy.atRiskCustomers}</p>',
              '<p className="text-sm text-foreground-muted">الحركات</p>': '<p className="text-sm text-foreground-muted">{copy.operations}</p>',
              '<p className="text-sm text-foreground-muted">رصيد الولاء المكتسب</p>': '<p className="text-sm text-foreground-muted">{copy.earnedBalance}</p>',
              '<p className="text-sm text-foreground-muted">إجمالي الولاء المكتسب</p>': '<p className="text-sm text-foreground-muted">{copy.lifetimeEarned}</p>',
              '<p className="text-sm text-foreground-muted">إجمالي الإنفاق المسجل</p>': '<p className="text-sm text-foreground-muted">{copy.totalTrackedSpend}</p>',
              '<p className="text-sm text-foreground-muted">إجمالي الزيارات</p>': '<p className="text-sm text-foreground-muted">{copy.totalVisits}</p>',
              '<p className="text-sm text-foreground-muted">متوسط الوقت لأول مكافأة</p>': '<p className="text-sm text-foreground-muted">{copy.averageFirstReward}</p>',
              '<p className="text-sm text-foreground-muted">متوسط قيمة الشراء</p>': '<p className="text-sm text-foreground-muted">{copy.averagePurchase}</p>',
              '<p className="text-sm text-foreground-muted">\n                متوسط الأيام بين الزيارات\n              </p>': '<p className="text-sm text-foreground-muted">{copy.averageDaysBetweenVisits}</p>',
              '<p className="text-sm text-foreground-muted">المكافآت المستبدلة</p>': '<p className="text-sm text-foreground-muted">{copy.redeemedRewards}</p>',
              '<p className="text-sm text-foreground-muted">مكافآت فُتحت</p>': '<p className="text-sm text-foreground-muted">{copy.unlockedRewards}</p>',
              '<p className="text-sm text-foreground-muted">أرصدة العملاء الحالية</p>': '<p className="text-sm text-foreground-muted">{copy.currentBalances}</p>',
              '<p className="text-sm text-foreground-muted">العملاء العائدون</p>': '<p className="text-sm text-foreground-muted">{copy.returningCustomers}</p>',
              '<p className="text-sm text-foreground-muted">معدل تكرار العملاء</p>': '<p className="text-sm text-foreground-muted">{copy.repeatCustomerRate}</p>',
              '<p className="text-sm text-foreground-muted">العملاء المستعادون</p>': '<p className="text-sm text-foreground-muted">{copy.recoveredCustomers}</p>',
              '<p className="text-sm text-foreground-muted">متوسط نشاط الولاء</p>': '<p className="text-sm text-foreground-muted">{copy.averageLoyaltyActivity}</p>',
              '<p className="text-sm text-foreground-muted">معدل استبدال المكافآت</p>': '<p className="text-sm text-foreground-muted">{copy.redemptionRate}</p>',
          }
          for old, new in replacements.items():
              replace_exact(old, new)

          replace_exact(
              '{segment\n                ? `ضمن شريحة ${getCustomerSegmentLabel(segment)}`\n                : "كل العملاء المسجلين"}',
              '{segment\n                ? `${copy.withinSegment} ${getCustomerSegmentLabel(segment, language)}`\n                : copy.allRegisteredCustomers}',
          )

          raw_text_replacements = {
              '              تم تسجيلهم خلال الفترة المحددة\n': '              {copy.registeredInPeriod}\n',
              '              عملاء لديهم حركات ولاء\n': '              {copy.customersWithLoyaltyActivity}\n',
              '              حسب قاعدة عدم النشاط الحالية\n': '              {copy.inactivityRule}\n',
              '              توقف نشاطهم مؤخرًا ويحتاجون متابعة\n': '              {copy.atRiskDetail}\n',
              '              عمليات الإضافة والاستبدال\n': '              {copy.earnAndRedeemOperations}\n',
              '                محسوب فقط من عمليات البيع المسجلة في LoyalFlow\n': '                {copy.trackedSalesOnly}\n',
              '                كل عمليات الإضافة المسجلة كزيارة\n': '                {copy.allRecordedVisits}\n',
              '              من إنشاء العميل حتى أول استبدال\n': '              {copy.fromCustomerToFirstRedemption}\n',
              '                متوسط عمليات الشراء المؤهلة خلال الفترة\n': '                {copy.eligiblePurchaseAverage}\n',
              '                بين الزيارات المسجلة خلال الفترة المحددة\n': '                {copy.recordedVisitSpacing}\n',
              '              مقياس على مستوى النشاط؛ لا يحمل فتح المكافأة فرعًا أو موظفًا في\n              السجل الحالي.\n': '              {copy.unlockScopeDetail}\n',
              '              عميل لديه عمليتا إضافة أو أكثر خلال الفترة\n': '              {copy.returningDetail}\n',
              '              العملاء ذوو عمليتي إضافة أو أكثر من العملاء النشطين بالولاء\n': '              {copy.repeatCustomerDetail}\n',
              '              حسابات أعيد تفعيلها خلال الفترة\n': '              {copy.recoveredDetail}\n',
              '              عمليات إضافة لكل عميل نشط\n': '              {copy.averageLoyaltyDetail}\n',
              '              نسبة الاستبدالات إلى عمليات الإضافة\n': '              {copy.redemptionRateDetail}\n',
          }
          for old, new in raw_text_replacements.items():
              replace_exact(old, new)

          replace_exact('{earned._count._all} عملية إضافة —{" "}', '{numberFormatter.format(earned._count._all)} {copy.earnOperation} —{" "}')
          replace_exact('{allTimeEarned._count._all} عملية إضافة منذ بداية البرنامج', '{numberFormatter.format(allTimeEarned._count._all)} {copy.earnOperation} {copy.sinceProgramStart}')
          replace_exact('`${averageDaysToFirstReward.toFixed(1)} يوم`', '`${averageDaysToFirstReward.toFixed(1)} ${copy.days}`')
          replace_exact('`${averageDaysBetweenVisits.toFixed(1)} يوم`', '`${averageDaysBetweenVisits.toFixed(1)} ${copy.days}`')
          replace_exact('              إجمالي التكلفة خلال الفترة: {redeemedCost} — الإجمالي منذ البداية:{" "}\n', '              {copy.periodCost}: {numberFormatter.format(redeemedCost)} — {copy.lifetimeTotal}:{" "}\n')
          replace_exact('              إجمالي {operationalUnitLabel(loyaltyPresentation)} المتاحة\n', '              {copy.availableBalanceTotal}: {operationalUnitLabel(loyaltyPresentation)}\n')

          impact_replacements = {
              '                أثر برنامج الولاء\n': '                {copy.impactEyebrow}\n',
              '<h2 className="mt-1 text-2xl font-black">مؤشرات تشغيلية موثقة</h2>': '<h2 className="mt-1 text-2xl font-black">{copy.verifiedOperationalMetrics}</h2>',
              '              تعرض هذه المؤشرات ما سجله LoyalFlow فقط. لا تنسب إيرادًا أو عائدًا\n              للبرنامج ما لم يكن مسجلاً صراحةً كعملية بيع.\n': '              {copy.impactDisclaimer}\n',
              'label: "عملاء عائدون"': 'label: copy.returningCustomers',
              'detail: "عمليتا إضافة أو أكثر خلال الفترة"': 'detail: copy.twoOrMoreEarns',
              'label: "عملاء مستعادون"': 'label: copy.recoveredCustomers',
              'detail: "حسابات أعيد تفعيلها خلال الفترة"': 'detail: copy.recoveredDetail',
              'label: "حركات ولاء مسجلة"': 'label: copy.loyaltyOperations',
              'detail: "إضافة، استبدال، أو تعديل ضمن الفترة"': 'detail: copy.loyaltyOperationsDetail',
              'label: "مكافآت مستبدلة"': 'label: copy.redeemedRewards',
              'detail: "استبدالات مسجلة خلال الفترة"': 'detail: copy.redemptionsInPeriod',
              'label: "معدل تكرار العملاء"': 'label: copy.repeatCustomerRate',
              'detail: "من العملاء ذوي نشاط الولاء"': 'detail: copy.amongLoyaltyActive',
              'label: "مبيعات ولاء مسجلة"': 'label: copy.trackedLoyaltySales',
              '"مبيعات أدخلها الموظفون خلال الفترة، وليست إسنادًا تسويقيًا"': 'copy.trackedLoyaltySalesDetail',
              'title: "الأكثر نشاطًا"': 'title: copy.mostActive',
              'description: "حسب كل حركات الولاء خلال الفترة."': 'description: copy.mostActiveDescription',
              'suffix: "حركة"': 'suffix: copy.movement',
              'title: "أعلى قيمة مكتسبة"': 'title: copy.highestEarned',
              'description: "حسب الرصيد المكتسب خلال الفترة."': 'description: copy.highestEarnedDescription',
              'title: "الأكثر استبدالًا"': 'title: copy.mostRedeemed',
              'description: "حسب المكافآت المستبدلة خلال الفترة."': 'description: copy.mostRedeemedDescription',
              'suffix: "مكافأة"': 'suffix: copy.reward',
              '                    لا توجد بيانات خلال هذه الفترة.\n': '                    {copy.noData}\n',
          }
          for old, new in impact_replacements.items():
              replace_exact(old, new)

          replace_exact('<h2 className="text-xl font-bold text-foreground">أحدث الحركات</h2>', '<h2 className="text-xl font-bold text-foreground">{copy.recentTransactions}</h2>')
          replace_exact('                أحدث 50 عملية خلال الفترة المحددة.\n', '                {copy.recentTransactionsDetail}\n')
          replace_exact('                لا توجد حركات خلال هذه الفترة.\n', '                {copy.noTransactions}\n')
          replace_exact('<table className="min-w-full text-right text-sm">', '<table dir={language === "AR" ? "rtl" : "ltr"} className="min-w-full text-start text-sm">')
          for old, new in {
              '<th className="px-6 py-4">العميل</th>': '<th className="px-6 py-4">{copy.customer}</th>',
              '<th className="px-6 py-4">النوع</th>': '<th className="px-6 py-4">{copy.type}</th>',
              '<th className="px-6 py-4">القيمة</th>': '<th className="px-6 py-4">{copy.value}</th>',
              '<th className="px-6 py-4">الرصيد</th>': '<th className="px-6 py-4">{copy.balance}</th>',
              '<th className="px-6 py-4">الموظف</th>': '<th className="px-6 py-4">{copy.staffMember}</th>',
              '<th className="px-6 py-4">التاريخ</th>': '<th className="px-6 py-4">{copy.date}</th>',
              ': "النظام";': ': copy.system;',
              '? "إضافة رصيد"': '? copy.addBalance',
              '? "استبدال مكافأة"': '? copy.redeemReward',
              ': "تعديل رصيد"}': ': copy.adjustBalance}',
          }.items():
              replace_exact(old, new)

          replace_exact('<h2 className="text-xl font-bold text-foreground">أفضل العملاء</h2>', '<h2 className="text-xl font-bold text-foreground">{copy.topCustomers}</h2>')
          replace_exact('              الترتيب حسب إجمالي رصيد الولاء المكتسب.\n', '              {copy.topCustomersDetail}\n')
          replace_exact('                  لا يوجد عملاء حتى الآن.\n', '                  {copy.noCustomers}\n')
          replace_exact('<div className="text-right">', '<div className="text-end">')
          replace_exact('                          الرصيد {customer.balance}\n', '                          {copy.balance}: {numberFormatter.format(customer.balance)}\n')

          path.write_text(source)
          PY
      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/f3-reports-presentation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/businesses/'[slug]'/reports/page.tsx .github/workflows/f3-reports-presentation-patch.yml
          git commit -m "fix: complete Reports AR/EN presentation parity"
          git push origin HEAD:final-product/f3-reports-presentation-parity
