name: Slice D Exact-SHA Runtime UAT

on:
  push:
    branches:
      - agent/slice-d-runtime-uat-run
    paths-ignore:
      - "uat-handshake/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-uat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAGING_UAT_BASE_URL: https://loyalflow-3grcrgavu-anas-tarek.vercel.app
      LOYALFLOW_ENVIRONMENT: staging
      LOYALFLOW_STAGING_DATABASE: neondb
      LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
      LOYALFLOW_STAGING_DATABASE_HOST: ep-lucky-mountain-adz1ckw2.c-2.us-east-1.aws.neon.tech
      LOYALFLOW_PRODUCTION_DATABASE_HOST: ep-spring-lake-adstmkl2.c-2.us-east-1.aws.neon.tech
    steps:
      - name: Checkout handshake branch
        uses: actions/checkout@v4
        with:
          ref: agent/slice-d-runtime-uat-run
          fetch-depth: 1

      - name: Mark runtime UAT pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg target "$target" '{state:"pending",context:"Slice D Runtime UAT",description:"Waiting for encrypted ephemeral UAT handoff",target_url:$target}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Generate ephemeral handoff key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/lf-uat-private.pem >/dev/null 2>&1
          public_b64="$(openssl pkey -in /tmp/lf-uat-private.pem -pubout -outform DER | base64 -w0)"
          publish_status() {
            context="$1"; description="$2"
            payload="$(jq -nc --arg context "$context" --arg description "$description" '{state:"pending",context:$context,description:$description}')"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          }
          publish_status "LFUATREQ:${GITHUB_RUN_ID}" "Ephemeral UAT handoff request"
          index=1
          while [ -n "$public_b64" ]; do
            chunk="${public_b64:0:70}"; public_b64="${public_b64:70}"
            publish_status "LFUATKEY${index}:${chunk}" "Ephemeral UAT public-key chunk"
            index=$((index + 1))
          done

      - name: Wait for encrypted handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/lf-uat-payload.json
          for attempt in $(seq 1 120); do
            response=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/uat-handshake/payload.json?ref=agent%2Fslice-d-runtime-uat-run" 2>/dev/null || true)
            if [ -n "$response" ]; then
              printf '%s' "$response" | jq -r '.content // empty' | tr -d '\n' | base64 -d > /tmp/lf-uat-payload.json 2>/dev/null || true
              if jq -e --arg requestId "$GITHUB_RUN_ID" '.requestId == $requestId' /tmp/lf-uat-payload.json >/dev/null 2>&1; then exit 0; fi
            fi
            sleep 4
          done
          echo "::error::Encrypted UAT handoff was not received for this run"
          exit 1

      - name: Decrypt and mask ephemeral handoff
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const payload = JSON.parse(fs.readFileSync('/tmp/lf-uat-payload.json', 'utf8'));
          const privateKey = fs.readFileSync('/tmp/lf-uat-private.pem', 'utf8');
          const key = crypto.privateDecrypt({ key: privateKey, oaepHash: 'sha256', padding: crypto.constants.RSA_PKCS1_OAEP_PADDING }, Buffer.from(payload.key, 'base64'));
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(payload.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(payload.tag, 'base64'));
          const clear = Buffer.concat([decipher.update(Buffer.from(payload.data, 'base64')), decipher.final()]);
          const values = JSON.parse(clear.toString('utf8'));
          for (const name of ['DATABASE_URL', 'UAT_FIXTURE_PASSWORD', 'VERCEL_SHARE_URL']) {
            if (!values[name]) throw new Error(`${name} missing from encrypted handoff`);
            process.stdout.write(`::add-mask::${values[name]}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<LFUATEOF\n${values[name]}\nLFUATEOF\n`);
          }
          NODE

      - name: Checkout exact certified source
        uses: actions/checkout@v4
        with:
          ref: 16053d9263c2e5346a2d2627d625a14b77930d05
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Establish share-link cookie session and verify Staging
        shell: bash
        run: |
          set -euo pipefail
          jar=/tmp/lf-vercel-cookies.txt
          body=/tmp/lf-health.json
          rm -f "$jar" "$body"
          share_token="$(node -e 'const u=new URL(process.env.VERCEL_SHARE_URL); const v=u.searchParams.get("_vercel_share"); if(!v) process.exit(2); process.stdout.write(v)')"
          echo "::add-mask::$share_token"
          health_share_url="$STAGING_UAT_BASE_URL/api/health/live?_vercel_share=$share_token"
          meta="$(curl -sS -L -c "$jar" -b "$jar" -o "$body" -w '%{http_code}|%{content_type}|%{url_effective}' "$health_share_url")"
          status="${meta%%|*}"
          if [ "$status" != "200" ]; then
            echo "::error::Share-link cookie session did not reach Staging health (HTTP $status)"
            exit 1
          fi
          node - "$body" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          let health;
          try { health = JSON.parse(fs.readFileSync(path, 'utf8')); }
          catch { throw new Error('Share-link cookie session returned non-JSON content'); }
          if (health?.environment !== 'staging' || health?.release !== '16053d9263c2') {
            throw new Error('Share-link cookie session reached the wrong runtime identity');
          }
          NODE
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/lf-vercel-cookies.txt', 'utf8').split(/\r?\n/).filter(l => l && (!l.startsWith('#') || l.startsWith('#HttpOnly_')));
          const cookies = lines.map(line => {
            const [domain, includeSubdomains, path, secure, expires, name, ...valueParts] = line.split('\t');
            return { name, value: valueParts.join('\t'), domain: domain.replace(/^#HttpOnly_/, ''), path, expires: Number(expires) || -1, httpOnly: line.startsWith('#HttpOnly_'), secure: secure === 'TRUE', sameSite: 'Lax' };
          });
          if (!cookies.length) throw new Error('Share-link flow produced no cookies');
          fs.writeFileSync('/tmp/lf-vercel-share-state.json', JSON.stringify({ cookies, origins: [] }), { mode: 0o600 });
          NODE
          echo "PLAYWRIGHT_STORAGE_STATE=/tmp/lf-vercel-share-state.json" >> "$GITHUB_ENV"

      - name: Configure MFA-aware cookie-session browser harness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const configPath = 'playwright.config.ts';
          let config = fs.readFileSync(configPath, 'utf8');
          const strict = `if (remoteStaging && !vercelProtectionBypass) {\n  throw new Error("VERCEL_AUTOMATION_BYPASS_SECRET is required for protected Remote Staging UAT.");\n}\n`;
          if (!config.includes(strict)) throw new Error('Expected remote-protection guard was not found');
          config = config.replace(strict, '');
          config = config.replace('  use: {\n', '  use: {\n    storageState: process.env.PLAYWRIGHT_STORAGE_STATE || undefined,\n');
          fs.writeFileSync(configPath, config);

          const specPath = 'tests/browser/pre-final-admin-security.spec.ts';
          let spec = fs.readFileSync(specPath, 'utf8');
          const broadSelector = 'page.getByRole("link", { name: /card/i })';
          const exactSelector = 'page.getByRole("link", { name: "Open customer card", exact: true })';
          if (!spec.includes(broadSelector)) throw new Error('Expected broad customer-card selector was not found');
          spec = spec.replace(broadSelector, exactSelector);

          const importMarker = 'import { deflateSync } from "node:zlib";';
          if (!spec.includes(importMarker)) throw new Error('Expected zlib import marker was not found');
          spec = spec.replace(importMarker, `${importMarker}\n\nimport { generateTotpCode } from "../../lib/auth/super-admin-mfa";`);

          const describeMarker = 'test.describe.serial("Pre-final administration and security UAT", () => {';
          if (!spec.includes(describeMarker)) throw new Error('Expected UAT describe marker was not found');
          const mfaHelper = `async function loginSuperAdminWithMfa(page: Page) {\n  const email = uatEmail("superadmin", fixture.runId);\n  const password = process.env.UAT_FIXTURE_PASSWORD!;\n\n  const fillPrimary = async () => {\n    await page.getByLabel("Email address").fill(email);\n    await page.getByLabel("Password").fill(password);\n    await page.getByRole("button", { name: "Sign in", exact: true }).press("Enter");\n  };\n\n  await page.goto("/login");\n  await fillPrimary();\n  const setupStep = page.getByTestId("login-mfa-setup-step");\n  await expect(setupStep).toBeVisible();\n  await setupStep.getByRole("link", { name: "Set up secure access", exact: true }).click();\n\n  await page.getByLabel("Super Admin email", { exact: true }).fill(email);\n  await page.getByLabel("Password", { exact: true }).fill(password);\n  await page.getByRole("button", { name: "Start MFA setup", exact: true }).click();\n  await expect(page.getByRole("heading", { name: "Add LoyalFlow to your authenticator", exact: true })).toBeVisible();\n\n  const secret = (await page.locator("code").first().innerText()).trim();\n  const recoveryCode = (await page.locator("code").nth(1).innerText()).trim();\n  expect(secret).toMatch(/^[A-Z2-7]+$/);\n  expect(recoveryCode).toMatch(/^[A-Z0-9-]+$/);\n\n  await page.getByLabel("6-digit authenticator code", { exact: true }).fill(generateTotpCode(secret));\n  await Promise.all([\n    page.waitForURL(/\\/login\\?mfa=enabled$/),\n    page.getByRole("button", { name: "Enable MFA", exact: true }).click(),\n  ]);\n\n  await fillPrimary();\n  await expect(page.getByTestId("login-mfa-step")).toBeVisible();\n  await page.locator("#mfaCode").fill(recoveryCode);\n  await page.locator("#mfaCode").press("Enter");\n  await expect(page).toHaveURL(/\\/dashboard$/);\n}\n\n`;
          spec = spec.replace(describeMarker, mfaHelper + describeMarker);

          const oldSuperAdminLogin = '    await login(page, "superadmin");';
          if (!spec.includes(oldSuperAdminLogin)) throw new Error('Expected Super Admin login call was not found');
          spec = spec.replace(oldSuperAdminLogin, '    await loginSuperAdminWithMfa(page);');
          fs.writeFileSync(specPath, spec);
          NODE

      - name: Run exact-SHA Slice D browser matrix with official fixtures
        run: pnpm exec playwright test tests/browser/pre-final-admin-security.spec.ts --config=playwright.config.ts

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-d-runtime-uat-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Remove ephemeral handoff files
        if: always()
        shell: bash
        run: rm -f /tmp/lf-uat-private.pem /tmp/lf-uat-payload.json /tmp/lf-vercel-cookies.txt /tmp/lf-health.json /tmp/lf-vercel-share-state.json

      - name: Mark runtime UAT success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg target "$target" '{state:"success",context:"Slice D Runtime UAT",description:"Exact-SHA Slice D browser matrix passed",target_url:$target}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Mark runtime UAT failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg target "$target" '{state:"failure",context:"Slice D Runtime UAT",description:"Exact-SHA Slice D browser matrix failed",target_url:$target}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

# target: staging-16053d9263c2-mfa-aware
