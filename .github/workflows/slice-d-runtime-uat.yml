name: Slice D Exact-SHA Runtime UAT

on:
  push:
    branches:
      - agent/slice-d-runtime-uat-run
    paths-ignore:
      - "uat-handshake/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-uat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_UAT_BASE_URL: https://loyalflow-ukz4t66jt-anas-tarek.vercel.app
      LOYALFLOW_ENVIRONMENT: staging
    steps:
      - name: Checkout handshake branch
        uses: actions/checkout@v4
        with:
          ref: agent/slice-d-runtime-uat-run
          fetch-depth: 1

      - name: Mark runtime UAT pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg target "$target" '{state:"pending",context:"Slice D Runtime UAT",description:"Waiting for encrypted ephemeral UAT handoff",target_url:$target}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Generate ephemeral handoff key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/lf-uat-private.pem >/dev/null 2>&1
          public_b64="$(openssl pkey -in /tmp/lf-uat-private.pem -pubout -outform DER | base64 -w0)"
          publish_status() {
            context="$1"
            description="$2"
            payload="$(jq -nc --arg context "$context" --arg description "$description" '{state:"pending",context:$context,description:$description}')"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }
          publish_status "LFUATREQ:${GITHUB_RUN_ID}" "Ephemeral UAT handoff request"
          index=1
          while [ -n "$public_b64" ]; do
            chunk="${public_b64:0:70}"
            public_b64="${public_b64:70}"
            publish_status "LFUATKEY${index}:${chunk}" "Ephemeral UAT public-key chunk"
            index=$((index + 1))
          done

      - name: Wait for encrypted handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/lf-uat-payload.json
          for attempt in $(seq 1 120); do
            response=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/uat-handshake/payload.json?ref=agent%2Fslice-d-runtime-uat-run" 2>/dev/null || true)
            if [ -n "$response" ]; then
              printf '%s' "$response" | jq -r '.content // empty' | tr -d '\n' | base64 -d > /tmp/lf-uat-payload.json 2>/dev/null || true
              if jq -e --arg requestId "$GITHUB_RUN_ID" '.requestId == $requestId' /tmp/lf-uat-payload.json >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 4
          done
          echo "::error::Encrypted UAT handoff was not received for this run"
          exit 1

      - name: Decrypt and mask ephemeral handoff
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const payload = JSON.parse(fs.readFileSync('/tmp/lf-uat-payload.json', 'utf8'));
          const privateKey = fs.readFileSync('/tmp/lf-uat-private.pem', 'utf8');
          const key = crypto.privateDecrypt(
            { key: privateKey, oaepHash: 'sha256', padding: crypto.constants.RSA_PKCS1_OAEP_PADDING },
            Buffer.from(payload.key, 'base64'),
          );
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(payload.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(payload.tag, 'base64'));
          const clear = Buffer.concat([
            decipher.update(Buffer.from(payload.data, 'base64')),
            decipher.final(),
          ]);
          const values = JSON.parse(clear.toString('utf8'));
          for (const name of ['UAT_FIXTURE_PASSWORD', 'VERCEL_SHARE_URL']) {
            if (!values[name]) throw new Error(`${name} missing from encrypted handoff`);
            process.stdout.write(`::add-mask::${values[name]}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<LFUATEOF\n${values[name]}\nLFUATEOF\n`);
          }
          if (!values.UAT_MANIFEST || typeof values.UAT_MANIFEST !== 'object') {
            throw new Error('UAT_MANIFEST missing from encrypted handoff');
          }
          fs.writeFileSync('/tmp/lf-uat-manifest.json', JSON.stringify(values.UAT_MANIFEST), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, 'STAGING_UAT_MANIFEST_PATH=/tmp/lf-uat-manifest.json\n');
          NODE

      - name: Checkout exact certified source
        uses: actions/checkout@v4
        with:
          ref: 62f656e2850253a31c2b561eb33e1602306d2340
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Bootstrap protected Staging browser session
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          const context = await browser.newContext();
          const page = await context.newPage();
          try {
            await page.goto(process.env.VERCEL_SHARE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1500);
            const response = await page.goto(`${process.env.STAGING_UAT_BASE_URL}/api/health/live`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() !== 200) {
              throw new Error(`Protected Staging health bootstrap failed with HTTP ${response?.status() ?? 'no-response'}`);
            }
            const health = JSON.parse(await page.locator('body').innerText());
            if (health?.environment !== 'staging' || health?.release !== '62f656e28502') {
              throw new Error('Protected Staging health identity did not match the certified release');
            }
            await context.storageState({ path: '/tmp/lf-vercel-share-state.json' });
          } finally {
            await browser.close();
          }
          NODE
          echo "PLAYWRIGHT_STORAGE_STATE=/tmp/lf-vercel-share-state.json" >> "$GITHUB_ENV"

      - name: Configure ephemeral protected-session test harness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const configPath = 'playwright.config.ts';
          let config = fs.readFileSync(configPath, 'utf8');
          const strict = `if (remoteStaging && !vercelProtectionBypass) {\n  throw new Error("VERCEL_AUTOMATION_BYPASS_SECRET is required for protected Remote Staging UAT.");\n}\n`;
          if (!config.includes(strict)) throw new Error('Expected remote-protection guard was not found');
          config = config.replace(strict, '');
          config = config.replace('  use: {\n', '  use: {\n    storageState: process.env.PLAYWRIGHT_STORAGE_STATE || undefined,\n');
          fs.writeFileSync(configPath, config);
          NODE

      - name: Run exact-SHA Slice D browser matrix
        run: pnpm exec playwright test tests/browser/pre-final-admin-security.spec.ts --config=playwright.config.ts

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-d-runtime-uat-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Remove ephemeral handoff files
        if: always()
        shell: bash
        run: rm -f /tmp/lf-uat-private.pem /tmp/lf-uat-payload.json /tmp/lf-uat-manifest.json /tmp/lf-vercel-share-state.json

      - name: Mark runtime UAT success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg target "$target" '{state:"success",context:"Slice D Runtime UAT",description:"Exact-SHA Slice D browser matrix passed",target_url:$target}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Mark runtime UAT failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg target "$target" '{state:"failure",context:"Slice D Runtime UAT",description:"Exact-SHA Slice D browser matrix failed",target_url:$target}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
