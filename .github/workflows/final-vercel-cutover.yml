name: Final Vercel Cutover Probe

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/final-vercel-cutover'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: prj_XR2myqPuensw4MTYF5Rgi0w0MPMG
      TEAM_ID: team_JIxldEzYlted09P36umRYSLa
      CERTIFIED_BASE_SHA: 4c26071ccf06718e8ec48247d051a7c31226f0c7
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Enforce exact certified base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.base.sha }}" != "$CERTIFIED_BASE_SHA" ]; then
            echo "::error::Refusing probe: staging base moved from certified SHA"
            exit 1
          fi

      - name: Confirm bounded Vercel credential availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_AVAILABLE=false" | tee "$RUNNER_TEMP/vercel-cutover-probe.txt"
            echo "::error::Repository secret VERCEL_TOKEN is not configured"
            exit 1
          fi
          echo "::add-mask::$VERCEL_TOKEN"
          echo "VERCEL_TOKEN_AVAILABLE=true" > "$RUNNER_TEMP/vercel-cutover-probe.txt"

      - name: Verify token can read project env metadata
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/vercel-env.json"
          status=$(curl -sS -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID")
          if [ "$status" != "200" ]; then
            echo "VERCEL_ENV_READ_HTTP=$status" >> "$RUNNER_TEMP/vercel-cutover-probe.txt"
            echo "::error::Vercel token cannot read project env metadata (HTTP $status)"
            rm -f "$response"
            exit 1
          fi
          jq -r '[.envs[]? | select(.key == "DATABASE_URL" or .key == "LOYALFLOW_STAGING_DATABASE_HOST" or .key == "LOYALFLOW_PRODUCTION_DATABASE_HOST") | {key,id,target,gitBranch}]' "$response" > "$RUNNER_TEMP/vercel-env-metadata.json"
          count=$(jq 'length' "$RUNNER_TEMP/vercel-env-metadata.json")
          echo "VERCEL_ENV_READ_HTTP=200" >> "$RUNNER_TEMP/vercel-cutover-probe.txt"
          echo "RELEVANT_ENV_ENTRIES=$count" >> "$RUNNER_TEMP/vercel-cutover-probe.txt"
          rm -f "$response"

      - name: Upload non-secret probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-vercel-cutover-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vercel-cutover-probe.txt
            ${{ runner.temp }}/vercel-env-metadata.json
          if-no-files-found: ignore
          retention-days: 1
