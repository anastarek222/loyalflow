name: Temporary Phase H Partial Browser UAT v2

on:
  push:
    branches:
      - agent/phase-h-partial-uat-20260915

permissions:
  contents: read

jobs:
  partial-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
      TARGET_SHA: f85b4f5abcd3ef6c129c5f23826c349de69f1025
      STAGING_UAT_BASE_URL: https://loyalflow-dhv01bm8y-anas-tarek.vercel.app
      LOYALFLOW_ENVIRONMENT: staging
      LOYALFLOW_STAGING_DATABASE: neondb
      LOYALFLOW_STAGING_DATABASE_HOST: ep-steep-bar-au02osd6-pooler.c-10.us-east-1.aws.neon.tech
      LOYALFLOW_PRODUCTION_DATABASE_HOST: ep-crimson-moon-au6bcbh1.c-10.us-east-1.aws.neon.tech
      LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
      PR_NUMBER: "549"
    steps:
      - name: Generate ephemeral handoff key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/handoff/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/handoff/private.pem -pubout -out /tmp/handoff/public.pem

      - name: Publish public handoff key
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-partial-v2-handoff-${{ github.run_id }}
          path: /tmp/handoff/public.pem
          retention-days: 1

      - name: Wait for encrypted handoff via public API
        shell: bash
        run: |
          set -euo pipefail
          prefix="phase-h-partial-v2-handoff:${GITHUB_RUN_ID}:"
          request_id="$GITHUB_RUN_ID"
          for attempt in $(seq 1 180); do
            body=$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -r --arg prefix "$prefix" '[.[] | .body | select(startswith($prefix))] | last // empty')
            if [ -n "$body" ]; then
              printf '%s' "${body#${prefix}}" | base64 -d > /tmp/handoff/payload.json
              if jq -e --arg requestId "$request_id" '.requestId == $requestId' /tmp/handoff/payload.json >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::Encrypted handoff was not received"
          exit 1

      - name: Decrypt ephemeral handoff
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL VERCEL_SHARE_URL; do
            jq -r --arg name "$name" '.secrets[$name]' /tmp/handoff/payload.json | base64 -d > "/tmp/handoff/${name}.enc"
            openssl pkeyutl -decrypt -inkey /tmp/handoff/private.pem -in "/tmp/handoff/${name}.enc" \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
              -out "/tmp/handoff/${name}.txt"
            value="$(cat "/tmp/handoff/${name}.txt")"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s<<PHUATEOF\n%s\nPHUATEOF\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          rm -rf /tmp/handoff

      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare runner-only fixture credentials and Chrome
        shell: bash
        run: |
          set -euo pipefail
          password="Uat-$(openssl rand -hex 18)-9Z!"
          auth_secret="$(openssl rand -hex 32)"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "::add-mask::$password"
          echo "::add-mask::$auth_secret"
          {
            echo "UAT_FIXTURE_PASSWORD=$password"
            echo "AUTH_SECRET=$auth_secret"
            echo "SYSTEM_CHROME=$chrome"
          } >> "$GITHUB_ENV"
          echo "FIXTURE_ONLY_AUTH_SECRET=GENERATED"
          echo "SUPER_ADMIN_MFA=EXCLUDED_REQUIRES_MATCHING_PREVIEW_SECRET"
          "$chrome" --version

      - name: Authenticate Preview and export browser state over CDP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase-h-profile && mkdir -p /tmp/phase-h-profile
          "$SYSTEM_CHROME" --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/phase-h-profile "$VERCEL_SHARE_URL" \
            >/tmp/phase-h-chrome.out 2>/tmp/phase-h-chrome.err &
          echo $! >/tmp/phase-h-chrome.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.connectOverCDP('http://127.0.0.1:9222');
          const context = browser.contexts()[0];
          if (!context) throw new Error('No Chrome context');
          const page = context.pages()[0] ?? await context.newPage();
          await page.goto(process.env.VERCEL_SHARE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
          const body = await page.locator('body').innerText();
          if (!/Tanee|LoyalFlow|Start your free trial|Sign in|تاني/i.test(body)) throw new Error(`Preview auth failed; host=${new URL(page.url()).hostname}`);
          await context.storageState({ path: '/tmp/phase-h-vercel-state.json' });
          console.log(`CDP_PREVIEW_AUTH=PASS host=${new URL(page.url()).hostname}`);
          await browser.close();
          NODE
          kill "$(cat /tmp/phase-h-chrome.pid)" 2>/dev/null || true

      - name: Invalid Public Card preflight before fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ executablePath: process.env.SYSTEM_CHROME, args: ['--no-sandbox'] });
          const context = await browser.newContext({ storageState: '/tmp/phase-h-vercel-state.json' });
          const page = await context.newPage();
          const response = await page.goto(`${process.env.STAGING_UAT_BASE_URL}/card/not-a-valid-public-token`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          if (!response || response.status() !== 404) throw new Error(`Invalid card expected 404, got ${response?.status()}`);
          const heading = (await page.locator('h1').first().innerText()).trim();
          if (!/Card unavailable|البطاقة غير متاحة/.test(heading)) throw new Error(`Unexpected heading: ${heading}`);
          console.log('INVALID_PUBLIC_CARD_PREFLIGHT=PASS status=404');
          await browser.close();
          NODE

      - name: Write partial browser config
        shell: bash
        run: |
          cat > phase-h.partial.config.ts <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests/browser', fullyParallel: false, forbidOnly: true, retries: 0, workers: 1, timeout: 75_000,
            reporter: [['list'], ['html', { open: 'never' }]],
            use: {
              baseURL: process.env.STAGING_UAT_BASE_URL!, browserName: 'chromium',
              launchOptions: { executablePath: process.env.SYSTEM_CHROME!, args: ['--no-sandbox'] },
              storageState: '/tmp/phase-h-vercel-state.json', trace: 'retain-on-failure', screenshot: 'only-on-failure', video: 'off', actionTimeout: 30_000,
            },
            projects: [
              { name: 'desktop', grep: /@desktop/, use: { viewport: { width: 1440, height: 900 } } },
              { name: 'mobile', grep: /@mobile/, use: { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true } },
            ],
          });
          EOF

      - name: Run Desktop and Mobile non-superadmin UAT
        shell: bash
        run: |
          set -uo pipefail
          overall=0
          for target in desktop mobile; do
            manifest="/tmp/phase-h-${target}.json"
            if ! npm run prepare:final-uat -- --base-url="$STAGING_UAT_BASE_URL" --manifest="$manifest" >"/tmp/phase-h-${target}-prepare.log" 2>&1; then
              echo "::error::${target} fixture preparation failed"
              cat "/tmp/phase-h-${target}-prepare.log"
              overall=1
              continue
            fi
            run_id="$(jq -r .runId "$manifest")"
            STAGING_UAT_MANIFEST_PATH="$manifest" pnpm exec playwright test tests/browser/final-uat-u13.spec.ts --config=phase-h.partial.config.ts --project="$target"
            test_code=$?
            cleanup_code=0
            npm run cleanup:final-uat -- --cleanup="$run_id" >"/tmp/phase-h-${target}-cleanup.log" 2>&1 || cleanup_code=$?
            if [ "$cleanup_code" -eq 0 ]; then echo "${target^^}_CLEANUP=PASS"; else overall=1; fi
            if [ "$test_code" -ne 0 ]; then overall=1; fi
          done
          echo "TABLET_SUPER_ADMIN_UAT=BLOCKED_REQUIRES_MATCHING_PREVIEW_AUTH_SECRET"
          exit "$overall"

      - name: Emergency cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d node_modules ]; then
            for manifest in /tmp/phase-h-desktop.json /tmp/phase-h-mobile.json; do
              if [ -f "$manifest" ]; then
                run_id=$(jq -r .runId "$manifest" 2>/dev/null)
                [ -n "$run_id" ] && [ "$run_id" != "null" ] && npm run cleanup:final-uat -- --cleanup="$run_id" >/dev/null 2>&1 || true
              fi
            done
          fi
          echo "EMERGENCY_CLEANUP_ATTEMPTED=YES"

      - name: Verify fixture count zero
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ ! -d node_modules ]; then
            echo "FINAL_UAT_FIXTURE_COUNT=NOT_REQUIRED_BEFORE_FIXTURE_STAGE"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const result = await client.query('SELECT count(*)::int AS count FROM "Business" WHERE name LIKE $1', ['LoyalFlow final UAT %']);
          await client.end();
          const count = result.rows[0]?.count ?? -1;
          console.log(`FINAL_UAT_FIXTURE_COUNT=${count}`);
          if (count !== 0) throw new Error(`Fixture cleanup incomplete: ${count}`);
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-partial-v2-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/phase-h-*-prepare.log
            /tmp/phase-h-*-cleanup.log
            /tmp/phase-h-chrome.err
          if-no-files-found: ignore
          retention-days: 7
