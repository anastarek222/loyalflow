name: Temporary align Slice D pnpm

on:
  push:
    branches: [fix/runtime-uat-pnpm-authority]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-uat-pnpm-authority
      - name: Apply bounded toolchain patch
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/slice-d-exact-sha-uat.yml
          count=$(grep -c '^          version: 10$' "$file")
          test "$count" -eq 1
          sed -i 's/^          version: 10$/          version: 11.17.0/' "$file"
          grep -q '^          version: 11.17.0$' "$file"
          rm .github/workflows/tmp-align-slice-d-pnpm.yml
      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' '.github/workflows/slice-d-exact-sha-uat.yml' '.github/workflows/tmp-align-slice-d-pnpm.yml' | sort)
          test "$changed" = "$expected"
      - name: Commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/slice-d-exact-sha-uat.yml .github/workflows/tmp-align-slice-d-pnpm.yml
          git commit -m 'fix: align Slice D UAT pnpm authority'
          git push origin HEAD:fix/runtime-uat-pnpm-authority
