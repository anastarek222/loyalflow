name: Generate LoyalFlow Master Report

on:
  push:
    branches:
      - docs/master-plan-report
    paths:
      - "docs/report/**"
      - ".github/workflows/generate-loyalflow-master-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: docs/master-plan-report

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated report tooling
        run: npm install --no-save --ignore-scripts @playwright/test@1.61.1

      - name: Install document and font tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            librsvg2-bin \
            poppler-utils \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-color-emoji

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate report source and mockups
        run: node docs/report/generate-loyalflow-master-report.mjs

      - name: Sanitize and render mockups for Word
        run: |
          for file in artifacts/loyalflow-master-report/mockups/*.svg; do
            perl -0pi -e 's/&(?![A-Za-z0-9#]+;)/&amp;/g' "$file"
            rsvg-convert "$file" -o "${file%.svg}.png"
          done

      - name: Re-render final PDF with sanitized mockups
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { chromium } from '@playwright/test';
          const reportDir = path.resolve('artifacts/loyalflow-master-report');
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await page.goto(`file://${path.join(reportDir, 'LoyalFlow_Master_Plan_AR.html')}`, { waitUntil: 'networkidle' });
          await page.pdf({
            path: path.join(reportDir, 'LoyalFlow_Master_Plan_AR.pdf'),
            format: 'A4',
            printBackground: true,
            margin: { top: '0', bottom: '0', left: '0', right: '0' },
          });
          await browser.close();
          NODE

      - name: Generate Microsoft Word document
        run: |
          pandoc \
            artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.md \
            --from=gfm+raw_html \
            --resource-path=artifacts/loyalflow-master-report \
            --metadata=lang:ar \
            --toc \
            --toc-depth=2 \
            -o artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.docx

      - name: Validate generated files
        run: |
          test -s artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.pdf
          test -s artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.docx
          pdfinfo artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.pdf
          unzip -t artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.docx
          ls -lh artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.pdf
          ls -lh artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.docx

      - name: Publish generated PDF and Word on report branch
        run: |
          mkdir -p docs/report/generated
          cp artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.pdf docs/report/generated/
          cp artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.docx docs/report/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report/generated
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish generated LoyalFlow master report [skip ci]"
            git push origin HEAD:docs/master-plan-report
          fi

      - name: Upload PDF and Word report
        uses: actions/upload-artifact@v4
        with:
          name: LoyalFlow-Master-Plan-AR
          path: |
            artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.pdf
            artifacts/loyalflow-master-report/LoyalFlow_Master_Plan_AR.docx
            artifacts/loyalflow-master-report/mockups/*.png
          if-no-files-found: error
          retention-days: 30
