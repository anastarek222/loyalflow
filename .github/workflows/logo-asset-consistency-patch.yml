import test from "node:test";

import {
  BUSINESS_LOGO_MAX_BYTES,
  BUSINESS_LOGO_OUTPUT_SIZE,
  getContainedSquarePlacement,
} from "@/lib/branding/business-logo-policy";

const source = (path: string) => readFileSync(join(process.cwd(), path), "utf8");

test("Business logo policy centers wide, tall, and square artwork in the canonical square", () => {
  assert.equal(BUSINESS_LOGO_MAX_BYTES, 500 * 1024);
  assert.equal(BUSINESS_LOGO_OUTPUT_SIZE, 512);
  assert.deepEqual(getContainedSquarePlacement(1000, 500), { x: 0, y: 128, width: 512, height: 256 });
  assert.deepEqual(getContainedSquarePlacement(500, 1000), { x: 128, y: 0, width: 256, height: 512 });
  assert.deepEqual(getContainedSquarePlacement(800, 800), { x: 0, y: 0, width: 512, height: 512 });
  assert.throws(() => getContainedSquarePlacement(0, 100));
});

