name: Logo Asset Consistency Patch

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/logo-asset-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/logo-asset-consistency
          fetch-depth: 0
      - name: Apply bounded patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          Path("lib/branding/business-logo-policy.ts").write_text('''export const BUSINESS_LOGO_MAX_BYTES = 500 * 1024;
export const BUSINESS_LOGO_OUTPUT_SIZE = 512;
export const BUSINESS_LOGO_ACCEPTED_MIME_TYPES = [
  "image/png",
  "image/jpeg",
  "image/webp",
] as const;

export type BusinessLogoMimeType =
  (typeof BUSINESS_LOGO_ACCEPTED_MIME_TYPES)[number];

export function getContainedSquarePlacement(
  sourceWidth: number,
  sourceHeight: number,
  outputSize = BUSINESS_LOGO_OUTPUT_SIZE,
) {
  if (sourceWidth <= 0 || sourceHeight <= 0 || outputSize <= 0) {
    throw new Error("Logo dimensions must be positive");
  }

  const scale = Math.min(outputSize / sourceWidth, outputSize / sourceHeight);
  const width = Math.round(sourceWidth * scale);
  const height = Math.round(sourceHeight * scale);

  return {
    x: Math.round((outputSize - width) / 2),
    y: Math.round((outputSize - height) / 2),
    width,
    height,
  };
}
''')
          Path("lib/branding/business-logo-client.ts").write_text('''import {
  BUSINESS_LOGO_ACCEPTED_MIME_TYPES,
  BUSINESS_LOGO_MAX_BYTES,
  BUSINESS_LOGO_OUTPUT_SIZE,
  getContainedSquarePlacement,
} from "@/lib/branding/business-logo-policy";

function loadImage(file: File) {
  return new Promise<HTMLImageElement>((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(objectUrl);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("Logo image could not be decoded"));
    };
    image.src = objectUrl;
  });
}

function canvasToBlob(canvas: HTMLCanvasElement, quality: number) {
  return new Promise<Blob | null>((resolve) => {
    canvas.toBlob(resolve, "image/webp", quality);
  });
}

function blobToDataUrl(blob: Blob) {
  return new Promise<string>((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () =>
      typeof reader.result === "string"
        ? resolve(reader.result)
        : reject(new Error("Logo image could not be encoded"));
    reader.onerror = () => reject(new Error("Logo image could not be encoded"));
    reader.readAsDataURL(blob);
  });
}

/** Normalizes an accepted Business logo to the canonical square full-frame asset. */
export async function normalizeBusinessLogoFile(file: File) {
  if (
    file.size <= 0 ||
    file.size > BUSINESS_LOGO_MAX_BYTES ||
    !BUSINESS_LOGO_ACCEPTED_MIME_TYPES.some((mimeType) => mimeType === file.type)
  ) {
    return null;
  }

  const image = await loadImage(file);
  const canvas = document.createElement("canvas");
  canvas.width = BUSINESS_LOGO_OUTPUT_SIZE;
  canvas.height = BUSINESS_LOGO_OUTPUT_SIZE;
  const context = canvas.getContext("2d");
  if (!context) throw new Error("Logo canvas is unavailable");

  context.clearRect(0, 0, canvas.width, canvas.height);
  const placement = getContainedSquarePlacement(image.naturalWidth, image.naturalHeight);
  context.drawImage(image, placement.x, placement.y, placement.width, placement.height);

  for (const quality of [0.9, 0.8, 0.7, 0.6, 0.5]) {
    const blob = await canvasToBlob(canvas, quality);
    if (blob && blob.size > 0 && blob.size <= BUSINESS_LOGO_MAX_BYTES) {
      return await blobToDataUrl(blob);
    }
  }
  return null;
}
''')
