name: Temporary Production Password Rotation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temp-production-password-rotation.yml

permissions:
  contents: write

jobs:
  rotate-password:
    if: github.head_ref == 'ops/production-password-rotation-340'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary password rotation branch
        uses: actions/checkout@v4
        with:
          ref: ops/production-password-rotation-340
          fetch-depth: 0

      - name: Verify exact Production release ancestry and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          expected="988f569e6cc0763789680d15a50f641da07f8e42"
          git fetch origin main --quiet
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$expected"
          changed="$(git diff --name-only "$expected"...HEAD | grep -v '^\.ops/' | sort)"
          expected_changed='.github/workflows/temp-production-password-rotation.yml'
          test "$changed" = "$expected_changed"
          echo "Exact Production release ancestry verified: ${expected:0:12}"

      - name: Generate ephemeral rotation-handoff key and publish public half
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/production-password-rotation-handoff.pem"
          pub="$RUNNER_TEMP/production-password-rotation-handoff.pub.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$key" >/dev/null 2>&1
          openssl pkey -in "$key" -pubout -out "$pub" >/dev/null 2>&1
          mkdir -p .ops
          cp "$pub" .ops/production-password-rotation-public.pem
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ops/production-password-rotation-public.pem
          git commit -m "ops(production): publish ephemeral password rotation key [skip ci]"
          git push origin HEAD:ops/production-password-rotation-340
          echo "Password rotation public key published; private half remains runner-local only."

      - name: Wait for encrypted owner rotation handoff
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 120); do
            git fetch origin ops/production-password-rotation-340 --quiet
            if git cat-file -e origin/ops/production-password-rotation-340:.ops/production-password-rotation-handoff.b64 2>/dev/null; then
              git show origin/ops/production-password-rotation-340:.ops/production-password-rotation-handoff.b64 > "$RUNNER_TEMP/production-password-rotation-handoff.b64"
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = "1"
          base64 -d "$RUNNER_TEMP/production-password-rotation-handoff.b64" > "$RUNNER_TEMP/production-password-rotation-handoff.bin"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/production-password-rotation-handoff.pem" \
            -in "$RUNNER_TEMP/production-password-rotation-handoff.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out "$RUNNER_TEMP/production-password-rotation-handoff.json"
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/production-password-rotation-handoff.json', 'utf8'));
          const expected = '988f569e6cc0763789680d15a50f641da07f8e42';
          if (payload.release !== expected) throw new Error('Release handoff mismatch');
          if (typeof payload.email !== 'string' || !payload.email.includes('@') || payload.email.length > 254) throw new Error('Invalid admin identity');
          if (typeof payload.token !== 'string' || payload.token.length < 30 || payload.token.length > 256) throw new Error('Invalid reset token');
          if (typeof payload.newPassword !== 'string' || payload.newPassword.length < 20 || payload.newPassword.length > 128) throw new Error('Invalid new password');
          for (const value of [payload.email, payload.token, payload.newPassword]) console.log(`::add-mask::${value}`);
          const marker = (name) => `LOYALFLOW_${name}_EOF`;
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_ADMIN_EMAIL<<${marker('EMAIL')}\n${payload.email}\n${marker('EMAIL')}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_RESET_TOKEN<<${marker('TOKEN')}\n${payload.token}\n${marker('TOKEN')}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_NEW_PASSWORD<<${marker('PASSWORD')}\n${payload.newPassword}\n${marker('PASSWORD')}\n`);
          NODE
          rm -f "$RUNNER_TEMP/production-password-rotation-handoff.b64" "$RUNNER_TEMP/production-password-rotation-handoff.bin" "$RUNNER_TEMP/production-password-rotation-handoff.json"
          git reset --hard origin/ops/production-password-rotation-340 >/dev/null
          echo "Encrypted Production password rotation handoff accepted for this runner only."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Rotate Production password through official reset flow and verify primary login
        env:
          PRODUCTION_BASE_URL: https://loyalflow-gray.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const expectedRelease = '988f569e6cc0';
          const browser = await chromium.launch();
          try {
            const context = await browser.newContext();
            const page = await context.newPage();

            const healthResponse = await page.request.get(`${process.env.PRODUCTION_BASE_URL}/api/health`);
            if (!healthResponse.ok()) throw new Error(`Production health failed: ${healthResponse.status()}`);
            const health = await healthResponse.json();
            if (health.environment !== 'production' || health.release !== expectedRelease) {
              throw new Error(`Unexpected Production release: ${health.release}`);
            }

            const resetUrl = `${process.env.PRODUCTION_BASE_URL}/reset-password?token=${encodeURIComponent(process.env.PRODUCTION_RESET_TOKEN)}`;
            await page.goto(resetUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (new URL(page.url()).origin !== process.env.PRODUCTION_BASE_URL || new URL(page.url()).pathname !== '/reset-password') {
              throw new Error('Unexpected reset destination');
            }
            await page.locator('input[name="newPassword"]').fill(process.env.PRODUCTION_NEW_PASSWORD);
            await page.locator('input[name="confirmPassword"]').fill(process.env.PRODUCTION_NEW_PASSWORD);
            await page.locator('button[type="submit"]').click();
            await page.waitForURL(/\/login\?reset=success(?:&|$)/, { timeout: 60000 });

            await page.locator('input[name="email"]').fill(process.env.PRODUCTION_ADMIN_EMAIL);
            await page.locator('input[name="password"]').fill(process.env.PRODUCTION_NEW_PASSWORD);
            await page.locator('button[type="submit"]').click();
            await page.getByTestId('login-mfa-step').waitFor({ state: 'visible', timeout: 60000 });
            console.log('PASSWORD_ROTATION_OUTCOME=rotated-and-primary-login-mfa-required');
          } finally {
            await browser.close();
          }
          NODE

      - name: Remove runner-local private material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/production-password-rotation-handoff.pem" "$RUNNER_TEMP/production-password-rotation-handoff.pub.pem" "$RUNNER_TEMP/production-password-rotation-handoff.b64" "$RUNNER_TEMP/production-password-rotation-handoff.bin" "$RUNNER_TEMP/production-password-rotation-handoff.json"
