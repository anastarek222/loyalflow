name: Temporary Tanee Production Auth Final Certification

on:
  push:
    branches:
      - fix/tanee-auth-email-sender
    paths:
      - ".github/workflows/tmp-tanee-production-auth-final-cert.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_EMAIL: anstarek211@gmail.com
      APP_ORIGIN: https://gettanee.com
    steps:
      - name: Submit Production password reset
        shell: bash
        run: |
          set -euo pipefail
          html="$(mktemp)"; headers="$(mktemp)"; body="$(mktemp)"
          curl --fail --silent --show-error "$APP_ORIGIN/forgot-password" -o "$html"
          action_name="$(grep -o '\$ACTION_ID_[A-Za-z0-9]*' "$html" | head -n 1)"
          test -n "$action_name"
          status="$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' -X POST -H "Origin: $APP_ORIGIN" -F "${action_name}=" -F "email=${TEST_EMAIL}" "$APP_ORIGIN/forgot-password")"
          echo "password_reset_status=$status"
          test "$status" = "303" -o "$status" = "302"
          grep -Eqi '^location: .*\/forgot-password\?sent=1' "$headers"

      - name: Submit Production verification resend
        shell: bash
        run: |
          set -euo pipefail
          html="$(mktemp)"; headers="$(mktemp)"; body="$(mktemp)"
          curl --fail --silent --show-error "$APP_ORIGIN/verify-email/resend" -o "$html"
          action_name="$(grep -o '\$ACTION_ID_[A-Za-z0-9]*' "$html" | head -n 1)"
          test -n "$action_name"
          status="$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' -X POST -H "Origin: $APP_ORIGIN" -F "${action_name}=" -F "email=${TEST_EMAIL}" "$APP_ORIGIN/verify-email/resend")"
          echo "verification_resend_status=$status"
          test "$status" = "303" -o "$status" = "302"
          grep -Eqi '^location: .*\/verify-email\/resend\?sent=1' "$headers"
