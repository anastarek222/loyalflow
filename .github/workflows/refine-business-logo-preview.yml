name: Refine Business Logo Preview

on:
  push:
    branches:
      - fix/business-logo-fit-crop-confirmation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/business-logo-fit-crop-confirmation
          fetch-depth: 0

      - name: Align pending preview and formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          wizard_path = Path('components/business-setup-wizard.tsx')
          wizard = wizard_path.read_text()

          old_warning = '''          setValidationError(
          language === "AR"
            ? copy.validation
              : "Confirm the square logo preview before creating the business.",
          );'''
          new_warning = '''          setValidationError(
            language === "AR"
              ? copy.validation
              : "Confirm the square logo preview before creating the business.",
          );'''
          if wizard.count(old_warning) != 1:
              raise SystemExit('expected exactly one submit warning formatting block')
          wizard = wizard.replace(old_warning, new_warning, 1)

          old_preview = '            preview={{ ...cardPreview, logoUrl: logoPreview }}'
          new_preview = '            preview={cardPreview}'
          if wizard.count(old_preview) != 1:
              raise SystemExit('expected exactly one Standard Card logo preview override')
          wizard = wizard.replace(old_preview, new_preview, 1)
          wizard_path.write_text(wizard)

          test_path = Path('tests/business-logo-crop-fit.test.ts')
          test = test_path.read_text()
          needle = '  assert.match(wizard, /onPendingChange=\\{setLogoCropPending\\}/);\n'
          addition = (
              needle
              + '  assert.match(wizard, /preview=\\{cardPreview\\}/);\n'
              + '  assert.doesNotMatch(wizard, /preview=\\{\\{ \\.\\.\\.cardPreview, logoUrl: logoPreview \\}\\}/);\n'
          )
          if test.count(needle) != 1:
              raise SystemExit('expected one pending-change assertion')
          test = test.replace(needle, addition, 1)
          test_path.write_text(test)
          PY

      - name: Validate bounded refinement
        run: |
          ! grep -q 'preventDfault' components/business-setup-wizard.tsx
          grep -q 'preview={cardPreview}' components/business-setup-wizard.tsx
          git diff --check

      - name: Commit refinement and remove helper
        run: |
          rm .github/workflows/refine-business-logo-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business-setup-wizard.tsx tests/business-logo-crop-fit.test.ts .github/workflows/refine-business-logo-preview.yml
          git commit -m "fix: align Business logo pending card preview"
          git push origin HEAD:fix/business-logo-fit-crop-confirmation
