name: T003 Super Admin MFA Focused

on:
  push:
    branches:
      - verify/t003-super-admin-mfa-focused

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Focused tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          node --import tsx --test tests/super-admin-mfa-lifecycle.test.ts > .mfa-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Lint slice
        id: lint
        continue-on-error: true
        run: |
          set +e
          pnpm exec eslint lib/auth/super-admin-mfa.ts lib/auth/super-admin-mfa-runtime.ts tests/super-admin-mfa-lifecycle.test.ts > .mfa-lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Record evidence
        if: always()
        run: |
          {
            echo "source_commit=8d13ef3eae7e7a980a4a269a1c9a6ef49ff4542b"
            echo "tests=${{ steps.tests.outcome }}"
            echo "tests_exit=${{ steps.tests.outputs.exit_code }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "lint_exit=${{ steps.lint.outputs.exit_code }}"
            echo
            echo "=== TESTS ==="
            cat .mfa-tests.log 2>/dev/null || true
            echo
            echo "=== LINT ==="
            cat .mfa-lint.log 2>/dev/null || true
          } > .t003-super-admin-mfa-focused.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .t003-super-admin-mfa-focused.txt
          git commit -m "chore(ci): record Super Admin MFA checks [skip ci]" || true
          git push
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
