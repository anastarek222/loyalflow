name: T003 Owner Invitation Copy Fix

on:
  push:
    branches:
      - codex/t003-owner-invitation-lifecycle

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align invitation success copy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/businesses/page.tsx")
          s = p.read_text()
          old = 'Owner invitation created. They can sign in to complete setup.'
          new = 'Owner invitation sent. The owner must use the email link to activate their account and complete setup.'
          if old not in s:
              raise SystemExit("invitation success copy anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/businesses/page.tsx
          git commit -m "fix(auth): align invitation delivery copy [skip ci]"
          git push
