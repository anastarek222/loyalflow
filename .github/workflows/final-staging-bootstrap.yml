name: Final Staging DB Bootstrap

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  bootstrap:
    if: github.head_ref == 'agent/final-staging-bootstrap' && github.event.pull_request.base.sha == '4c26071ccf06718e8ec48247d051a7c31226f0c7'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: production
      LOYALFLOW_ENVIRONMENT: staging
      VERCEL_ENV: preview
      LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
      LOYALFLOW_STAGING_DATABASE: neondb
      LOYALFLOW_STAGING_DATABASE_HOST: ep-steep-bar-au02osd6-pooler.c-10.us-east-1.aws.neon.tech
      LOYALFLOW_PRODUCTION_DATABASE_HOST: ep-spring-lake-adstmkl2-pooler.c-2.us-east-1.aws.neon.tech
      BOOTSTRAP_RUN: 4c26071ccf
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CERTIFIED_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Generate ephemeral handoff key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lf-bootstrap
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/lf-bootstrap/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/lf-bootstrap/private.pem -pubout -out /tmp/lf-bootstrap/public.pem
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/lf-bootstrap/request-id

      - name: Publish public handoff key
        uses: actions/upload-artifact@v4
        with:
          name: final-staging-bootstrap-handoff-${{ github.run_id }}
          path: |
            /tmp/lf-bootstrap/public.pem
            /tmp/lf-bootstrap/request-id
          retention-days: 1

      - name: Wait for encrypted bootstrap handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="final-staging-bootstrap:${GITHUB_RUN_ID}:"
          rm -f /tmp/lf-bootstrap/payload.json
          for attempt in $(seq 1 120); do
            body=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -r --arg prefix "$prefix" '[.[] | .body | select(startswith($prefix))] | last // empty')
            if [ -n "$body" ]; then
              encoded="${body#${prefix}}"
              printf '%s' "$encoded" | base64 -d > /tmp/lf-bootstrap/payload.json
              if jq -e --arg requestId "$GITHUB_RUN_ID" '.requestId == $requestId' /tmp/lf-bootstrap/payload.json >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::Encrypted bootstrap handoff was not received"
          exit 1

      - name: Decrypt ephemeral handoff
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const payload = JSON.parse(fs.readFileSync('/tmp/lf-bootstrap/payload.json', 'utf8'));
          const privateKey = fs.readFileSync('/tmp/lf-bootstrap/private.pem', 'utf8');
          const key = crypto.privateDecrypt(
            { key: privateKey, oaepHash: 'sha256', padding: crypto.constants.RSA_PKCS1_OAEP_PADDING },
            Buffer.from(payload.key, 'base64'),
          );
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(payload.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(payload.tag, 'base64'));
          const clear = Buffer.concat([
            decipher.update(Buffer.from(payload.data, 'base64')),
            decipher.final(),
          ]);
          const values = JSON.parse(clear.toString('utf8'));
          for (const name of ['DATABASE_URL', 'UAT_FIXTURE_PASSWORD']) {
            if (!values[name]) throw new Error(`${name} missing from encrypted handoff`);
            process.stdout.write(`::add-mask::${values[name]}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<LFBOOTEOF\n${values[name]}\nLFBOOTEOF\n`);
          }
          NODE
          rm -f /tmp/lf-bootstrap/payload.json /tmp/lf-bootstrap/private.pem

      - name: Checkout certified Staging source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare guarded Staging fixtures
        shell: bash
        run: |
          set -euo pipefail
          pnpm prepare:final-uat -- --run="$BOOTSTRAP_RUN" --base-url=https://loyalflow-git-staging-anas-tarek.vercel.app

      - name: Verify bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const email = `lf-uat-final-superadmin-${process.env.BOOTSTRAP_RUN}@example.test`;
          const admin = await client.query('SELECT role, "isActive", "businessId" FROM "User" WHERE email = $1', [email]);
          if (admin.rowCount !== 1 || admin.rows[0].role !== 'SUPER_ADMIN' || admin.rows[0].isActive !== true || admin.rows[0].businessId !== null) {
            throw new Error('Guarded Staging super-admin fixture verification failed');
          }
          const businesses = await client.query('SELECT count(*)::int AS count FROM "Business" WHERE slug LIKE $1', [`lf-uat-final-%-${process.env.BOOTSTRAP_RUN}`]);
          if ((businesses.rows[0]?.count ?? 0) < 1) throw new Error('Guarded Staging business fixtures were not created');
          console.log(`BOOTSTRAP VERIFIED run=${process.env.BOOTSTRAP_RUN} businesses=${businesses.rows[0].count} superadmin=${email}`);
          await client.end();
          NODE

      - name: Write non-secret receipt
        shell: bash
        run: |
          cat > /tmp/lf-bootstrap/receipt.txt <<EOF
          certified_sha=${CERTIFIED_SHA}
          run_id=${BOOTSTRAP_RUN}
          superadmin=lf-uat-final-superadmin-${BOOTSTRAP_RUN}@example.test
          database=neondb
          status=verified
          EOF

      - name: Upload bootstrap receipt
        uses: actions/upload-artifact@v4
        with:
          name: final-staging-bootstrap-receipt-${{ github.run_id }}
          path: /tmp/lf-bootstrap/receipt.txt
          retention-days: 7
