name: T003 Super Admin MFA Build

on:
  push:
    branches:
      - verify/t003-super-admin-mfa-build

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://verification:verification@127.0.0.1:5432/verification
      AUTH_SECRET: verification-only-root-secret-0123456789abcdef0123456789abcdef
      NEXTAUTH_SECRET: verification-only-root-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build > .build.log 2>&1
      - name: Record evidence
        if: always()
        run: |
          {
            echo "source_commit=$(git rev-parse HEAD^)"
            echo "build=${{ steps.build.outcome }}"
            echo "=== BUILD ==="
            tail -n 160 .build.log || true
          } > .t003-super-admin-mfa-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .t003-super-admin-mfa-build.txt
          git commit -m "chore(ci): record MFA build gate [skip ci]" || true
          git push
      - name: Enforce
        if: always()
        run: test "${{ steps.build.outcome }}" = success
