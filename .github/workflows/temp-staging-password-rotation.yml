name: Temporary Staging Password Rotation

on:
  pull_request:
    branches:
      - staging
    types: [opened]
    paths:
      - .github/workflows/temp-staging-password-rotation.yml

permissions:
  contents: write

jobs:
  rotate-password:
    if: github.head_ref == 'ops/staging-password-rotation-340'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary password rotation branch
        uses: actions/checkout@v4
        with:
          ref: ops/staging-password-rotation-340
          fetch-depth: 0

      - name: Verify exact Staging ancestry and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          expected="85de24b6ea1a00a279deb72daff6a053a0cfa7b3"
          git fetch origin staging --quiet
          base="$(git merge-base HEAD origin/staging)"
          test "$base" = "$expected"
          changed="$(git diff --name-only "$expected"...HEAD | grep -v '^\.ops/' | sort)"
          test "$changed" = '.github/workflows/temp-staging-password-rotation.yml'
          echo "Exact Staging ancestry verified: ${expected:0:12}"

      - name: Generate ephemeral handoff key
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/staging-password-rotation.pem"
          pub="$RUNNER_TEMP/staging-password-rotation.pub.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$key" >/dev/null 2>&1
          openssl pkey -in "$key" -pubout -out "$pub" >/dev/null 2>&1
          mkdir -p .ops
          cp "$pub" .ops/staging-password-rotation-public.pem
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ops/staging-password-rotation-public.pem
          git commit -m "ops(staging): publish ephemeral password rotation key [skip ci]"
          git push origin HEAD:ops/staging-password-rotation-340
          echo "Ephemeral public key published; private half remains runner-local."

      - name: Wait for encrypted reset-request handoff
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 120); do
            git fetch origin ops/staging-password-rotation-340 --quiet
            if git cat-file -e origin/ops/staging-password-rotation-340:.ops/staging-password-rotation-request.b64 2>/dev/null; then
              git show origin/ops/staging-password-rotation-340:.ops/staging-password-rotation-request.b64 > "$RUNNER_TEMP/request.b64"
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = "1"
          base64 -d "$RUNNER_TEMP/request.b64" > "$RUNNER_TEMP/request.bin"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/staging-password-rotation.pem" -in "$RUNNER_TEMP/request.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$RUNNER_TEMP/request.json"
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/request.json', 'utf8'));
          const expected = '85de24b6ea1a00a279deb72daff6a053a0cfa7b3';
          if (p.release !== expected) throw new Error('Release handoff mismatch');
          if (typeof p.email !== 'string' || !p.email.includes('@') || p.email.length > 254) throw new Error('Invalid admin identity');
          const u = new URL(p.shareUrl);
          if (u.protocol !== 'https:' || !u.hostname.endsWith('.vercel.app') || !u.searchParams.get('_vercel_share')) throw new Error('Invalid Staging share URL');
          console.log(`::add-mask::${p.email}`);
          console.log(`::add-mask::${p.shareUrl}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_ADMIN_EMAIL=${p.email}\nSTAGING_SHARE_URL=${p.shareUrl}\nSTAGING_BASE_URL=${u.origin}\n`);
          NODE
          rm -f "$RUNNER_TEMP/request.b64" "$RUNNER_TEMP/request.bin" "$RUNNER_TEMP/request.json"
          git reset --hard origin/ops/staging-password-rotation-340 >/dev/null

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Request official Staging password reset
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto(process.env.STAGING_SHARE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.goto(`${process.env.STAGING_BASE_URL}/forgot-password`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('input[name="email"]').fill(process.env.STAGING_ADMIN_EMAIL);
            await page.locator('button[type="submit"]').click();
            await page.waitForURL(/\/forgot-password\?sent=1(?:&|$)/, { timeout: 60000 });
            console.log('STAGING_PASSWORD_RESET_REQUEST=issued');
          } finally {
            await browser.close();
          }
          NODE

      - name: Wait for encrypted reset-token handoff
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 180); do
            git fetch origin ops/staging-password-rotation-340 --quiet
            if git cat-file -e origin/ops/staging-password-rotation-340:.ops/staging-password-rotation-complete.b64 2>/dev/null; then
              git show origin/ops/staging-password-rotation-340:.ops/staging-password-rotation-complete.b64 > "$RUNNER_TEMP/complete.b64"
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = "1"
          base64 -d "$RUNNER_TEMP/complete.b64" > "$RUNNER_TEMP/complete.bin"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/staging-password-rotation.pem" -in "$RUNNER_TEMP/complete.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$RUNNER_TEMP/complete.json"
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/complete.json', 'utf8'));
          const expected = '85de24b6ea1a00a279deb72daff6a053a0cfa7b3';
          if (p.release !== expected) throw new Error('Release handoff mismatch');
          if (typeof p.token !== 'string' || p.token.length < 30 || p.token.length > 256) throw new Error('Invalid reset token');
          if (typeof p.newPassword !== 'string' || p.newPassword.length < 10 || p.newPassword.length > 128) throw new Error('Invalid password');
          console.log(`::add-mask::${p.token}`);
          console.log(`::add-mask::${p.newPassword}`);
          const marker = (n) => `LOYALFLOW_${n}_EOF`;
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_RESET_TOKEN<<${marker('TOKEN')}\n${p.token}\n${marker('TOKEN')}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_NEW_PASSWORD<<${marker('PASSWORD')}\n${p.newPassword}\n${marker('PASSWORD')}\n`);
          NODE
          rm -f "$RUNNER_TEMP/complete.b64" "$RUNNER_TEMP/complete.bin" "$RUNNER_TEMP/complete.json"
          git reset --hard origin/ops/staging-password-rotation-340 >/dev/null

      - name: Rotate Staging password through official flow and verify primary login
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto(process.env.STAGING_SHARE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const resetUrl = `${process.env.STAGING_BASE_URL}/reset-password?token=${encodeURIComponent(process.env.STAGING_RESET_TOKEN)}`;
            await page.goto(resetUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('input[name="newPassword"]').fill(process.env.STAGING_NEW_PASSWORD);
            await page.locator('input[name="confirmPassword"]').fill(process.env.STAGING_NEW_PASSWORD);
            await page.locator('button[type="submit"]').click();
            await page.waitForURL(/\/login\?reset=success(?:&|$)/, { timeout: 60000 });
            await page.locator('input[name="email"]').fill(process.env.STAGING_ADMIN_EMAIL);
            await page.locator('input[name="password"]').fill(process.env.STAGING_NEW_PASSWORD);
            await page.locator('button[type="submit"]').click();
            const mfa = page.getByTestId('login-mfa-step');
            const setup = page.getByTestId('login-mfa-setup-step');
            const deadline = Date.now() + 60000;
            let outcome = '';
            while (Date.now() < deadline) {
              if (await mfa.isVisible().catch(() => false)) { outcome = 'mfa-required'; break; }
              if (await setup.isVisible().catch(() => false)) { outcome = 'mfa-setup-required'; break; }
              await page.waitForTimeout(500);
            }
            if (!outcome) throw new Error('New password was not accepted into an MFA state');
            console.log(`STAGING_PASSWORD_ROTATION_OUTCOME=rotated-and-${outcome}`);
          } finally {
            await browser.close();
          }
          NODE

      - name: Remove runner-local private material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/staging-password-rotation.pem" "$RUNNER_TEMP/staging-password-rotation.pub.pem" "$RUNNER_TEMP/request.b64" "$RUNNER_TEMP/request.bin" "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/complete.b64" "$RUNNER_TEMP/complete.bin" "$RUNNER_TEMP/complete.json"
