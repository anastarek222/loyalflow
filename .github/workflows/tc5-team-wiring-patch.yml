name: TC5 Team Wiring Patch

on:
  push:
    branches:
      - "agent/tc5-team-provisioning-wiring"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "agent/tc5-team-provisioning-wiring"
          fetch-depth: 0
      - run: python scripts/tc5-team-wiring-patch.py
      - run: git diff --check
      - name: Commit source patch and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tc5-team-wiring-patch.yml scripts/tc5-team-wiring-patch.py
          git add app/businesses/'[slug]'/users/actions.ts tests/team-direct-login-readiness.test.ts
          git commit -m "refactor(tc5): wire team provisioning command"
          git push origin HEAD:agent/tc5-team-provisioning-wiring
