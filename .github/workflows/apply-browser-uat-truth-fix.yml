name: Apply browser UAT truth fix

on:
  push:
    branches: [fix/reward-truth-core]
    paths: [.github/workflows/apply-browser-uat-truth-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/reward-truth-core
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make bounded browser receipts explicit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              print(f"{label}: {count} match(es)")
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          def replace_section(path: str, start_marker: str, end_marker: str, transform, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{path}: {label}: start marker not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{path}: {label}: end marker not found")
              section = text[start:end]
              updated = transform(section)
              if updated == section:
                  raise SystemExit(f"{path}: {label}: section was not changed")
              file.write_text(text[:start] + updated + text[end:])
              print(f"{label}: updated")

          replace_once(
              "tests/browser/owner-onboarding-mobile.spec.ts",
              "    if (process.env.STAGING_UAT_MANIFEST_PATH?.trim()) return;\n",
              '''    if (process.env.STAGING_UAT_MANIFEST_PATH?.trim()) {
              test.skip(
                true,
                "The complete Owner launch and direct re-entry receipt requires the disposable PR database; remote exact-SHA UAT only verifies the shared mutation-free runtime.",
              );
            }
          ''',
              "owner remote boundary",
          )

          def explicit_not_configured_skip(section: str) -> str:
              old = "      await expect(notConfigured).toBeVisible();\n      return;\n"
              new = '''      await expect(notConfigured).toBeVisible();
              test.skip(
                true,
                "The bounded publish lifecycle requires Vercel Blob to be configured for this runtime.",
              );
          '''
              if section.count(old) != 1:
                  raise SystemExit(f"custom card not-configured block: expected one silent return, found {section.count(old)}")
              return section.replace(old, new, 1)

          replace_section(
              "tests/browser/pilot-custom-card.spec.ts",
              "    if (await notConfigured.count()) {",
              '    const frontInput = page.getByLabel("Front artwork", { exact: true });',
              explicit_not_configured_skip,
              "custom card Blob-not-configured boundary",
          )

          def explicit_cleanup_skip(section: str) -> str:
              old = "      return;\n"
              new = '''      test.skip(
                true,
                "Valid upload/publish requires a runner Blob cleanup credential so immutable UAT artwork can be cleaned.",
              );
          '''
              if section.count(old) != 1:
                  raise SystemExit(f"custom card cleanup block: expected one silent return, found {section.count(old)}")
              return section.replace(old, new, 1)

          replace_section(
              "tests/browser/pilot-custom-card.spec.ts",
              "    if (!canCleanUploadedBlobArtwork()) {",
              '    await page.getByLabel("Front artwork", { exact: true }).setInputFiles({',
              explicit_cleanup_skip,
              "custom card cleanup-credential boundary",
          )

          owner_contract = Path("tests/pilot-owner-onboarding-receipt.test.ts")
          text = owner_contract.read_text()
          needle = "STAGING_UAT_MANIFEST_PATH"
          anchor = text.find(needle)
          if anchor < 0:
              raise SystemExit("owner contract: staging manifest assertion not found")
          block_start = text.rfind("  assert.match(\n", 0, anchor)
          block_end = text.find('  assert.match(fixtures, /"pending-owner"/);', anchor)
          if block_start < 0 or block_end < 0:
              raise SystemExit("owner contract: could not bound old manifest assertion")
          replacement = '''  assert.match(
            browser,
            /if \\(process\\.env\\.STAGING_UAT_MANIFEST_PATH\\?\\.trim\\(\\)\\) \\{[\\s\\S]*?test\\.skip\\(/,
          );
          assert.doesNotMatch(
            browser,
            /if \\(process\\.env\\.STAGING_UAT_MANIFEST_PATH\\?\\.trim\\(\\)\\) return/,
          );
          '''
          owner_contract.write_text(text[:block_start] + replacement + text[block_end:])
          print("owner contract: updated")

          custom_contract = Path("tests/pilot-custom-card-receipt.test.ts")
          text = custom_contract.read_text()
          marker = "  assert.match(browser, /canCleanUploadedBlobArtwork/);\n"
          if text.count(marker) != 1:
              raise SystemExit(f"custom card contract: expected one marker, found {text.count(marker)}")
          assertions = '''  assert.match(
            browser,
            /if \\(await notConfigured\\.count\\(\\)\\) \\{\\s*await expect\\(notConfigured\\)\\.toBeVisible\\(\\);\\s*test\\.skip\\(/,
          );
          assert.doesNotMatch(
            browser,
            /if \\(await notConfigured\\.count\\(\\)\\) \\{\\s*await expect\\(notConfigured\\)\\.toBeVisible\\(\\);\\s*return;/,
          );
          assert.match(
            browser,
            /if \\(!canCleanUploadedBlobArtwork\\(\\)\\) \\{[\\s\\S]*?type: "bounded-runtime"[\\s\\S]*?test\\.skip\\(/,
          );
          assert.doesNotMatch(
            browser,
            /type: "bounded-runtime"[\\s\\S]*?\\}\\);\\s*return;/,
          );
          '''
          custom_contract.write_text(text.replace(marker, marker + assertions, 1))
          print("custom card contract: updated")
          PY

          git diff --check
          git diff -- \
            tests/browser/owner-onboarding-mobile.spec.ts \
            tests/browser/pilot-custom-card.spec.ts \
            tests/pilot-owner-onboarding-receipt.test.ts \
            tests/pilot-custom-card-receipt.test.ts

      - name: Run affected source-contract tests
        env:
          NODE_ENV: test
        run: >-
          node --import tsx --test
          tests/pilot-owner-onboarding-receipt.test.ts
          tests/pilot-custom-card-receipt.test.ts

      - name: Commit scoped fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-browser-uat-truth-fix.yml
          git add \
            tests/browser/owner-onboarding-mobile.spec.ts \
            tests/browser/pilot-custom-card.spec.ts \
            tests/pilot-owner-onboarding-receipt.test.ts \
            tests/pilot-custom-card-receipt.test.ts
          git commit -m "test: make browser UAT skips explicit"
          git push origin HEAD:fix/reward-truth-core
