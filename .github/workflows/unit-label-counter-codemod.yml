name: Unit Label Counter Codemod

on:
  push:
    branches:
      - fix/master-plan-unit-label-counter

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/master-plan-unit-label-counter

      - name: Apply exact bounded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(content.replace(old, new, 1))

          replace_once(
              "components/business-setup-wizard.tsx",
              'import { STANDARD_CARD_UNIT_LABEL_MAX_LENGTH } from "@/lib/cards/standard-card-text";\n',
              'import { UnitLabelInput } from "@/components/unit-label-input";\n',
          )
          replace_once(
              "components/business-setup-wizard.tsx",
              '''          <input
            name="unitName"
            required
            defaultValue={copy.defaultUnit}
            maxLength={STANDARD_CARD_UNIT_LABEL_MAX_LENGTH}
            placeholder={copy.unitName}
            className={fieldClass}
          />''',
              '''          <UnitLabelInput
            name="unitName"
            required
            defaultValue={copy.defaultUnit}
            placeholder={copy.unitName}
            className={fieldClass}
          />''',
          )

          replace_once(
              "components/owner-onboarding-wizard.tsx",
              'import { STANDARD_CARD_UNIT_LABEL_MAX_LENGTH } from "@/lib/cards/standard-card-text";\n',
              'import { UnitLabelInput } from "@/components/unit-label-input";\n',
          )
          replace_once(
              "components/owner-onboarding-wizard.tsx",
              '''              <input
                data-onboarding-field="unitName"
                name="unitName"
                aria-invalid={Boolean(fieldErrors.unitName)}
                defaultValue={String(draft.unitName || "Visit")}
                onChange={updateCardPreview}
                maxLength={STANDARD_CARD_UNIT_LABEL_MAX_LENGTH}
                className="mt-2 min-h-12 w-full rounded-xl border px-4 py-3"
              />''',
              '''              <UnitLabelInput
                data-onboarding-field="unitName"
                name="unitName"
                aria-invalid={Boolean(fieldErrors.unitName)}
                defaultValue={String(draft.unitName || "Visit")}
                onChange={updateCardPreview}
                className="mt-2 min-h-12 w-full rounded-xl border px-4 py-3"
              />''',
          )

          replace_once(
              "components/program-rules-form.tsx",
              'import type { ProgramRulesBusiness } from "@/components/business-settings-form";\n',
              'import type { ProgramRulesBusiness } from "@/components/business-settings-form";\nimport { UnitLabelInput } from "@/components/unit-label-input";\n',
          )
          replace_once(
              "components/program-rules-form.tsx",
              '''            <input
              name={name}
              type={
                name === "earnAmount" || name === "rewardThreshold"
                  ? "number"
                  : "text"
              }
              min={
                name === "earnAmount" || name === "rewardThreshold"
                  ? 1
                  : undefined
              }
              defaultValue={value}
              required={[
                "unitName",
                "earnAmount",
                "rewardName",
                "rewardThreshold",
              ].includes(name)}
              maxLength={maxLength}
              className={inputClass}
            />''',
              '''            {name === "unitName" ? (
              <UnitLabelInput
                name={name}
                defaultValue={value}
                required
                className={inputClass}
              />
            ) : (
              <input
                name={name}
                type={
                  name === "earnAmount" || name === "rewardThreshold"
                    ? "number"
                    : "text"
                }
                min={
                  name === "earnAmount" || name === "rewardThreshold"
                    ? 1
                    : undefined
                }
                defaultValue={value}
                required={[
                  "earnAmount",
                  "rewardName",
                  "rewardThreshold",
                ].includes(name)}
                maxLength={maxLength}
                className={inputClass}
              />
            )}''',
          )

          Path("tests/unit-label-counter.test.ts").write_text('''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import { join } from "node:path";
import test from "node:test";

import {
  STANDARD_CARD_UNIT_LABEL_MAX_LENGTH,
  standardCardGraphemeLength,
} from "../lib/cards/standard-card-text";

const root = process.cwd();
const source = (path: string) => readFileSync(join(root, path), "utf8");

test("unit label authority remains 18 graphemes", () => {
  assert.equal(STANDARD_CARD_UNIT_LABEL_MAX_LENGTH, 18);
  assert.equal(standardCardGraphemeLength("👨‍👩‍👧‍👦"), 1);
});

test("shared unit label input exposes a live x/18 counter", () => {
  const input = source("components/unit-label-input.tsx");
  assert.match(input, /standardCardGraphemeLength/);
  assert.match(input, /data-unit-label-counter/);
  assert.match(input, /\{count\}\/\{STANDARD_CARD_UNIT_LABEL_MAX_LENGTH\}/);
});

test("all editable unit-name surfaces consume the shared counter input", () => {
  for (const path of [
    "components/business-setup-wizard.tsx",
    "components/owner-onboarding-wizard.tsx",
    "components/program-rules-form.tsx",
  ]) {
    const content = source(path);
    assert.match(content, /import \{ UnitLabelInput \} from "@\/components\/unit-label-input"/);
    assert.match(content, /<UnitLabelInput/);
  }
});
''')

          Path(".github/workflows/unit-label-counter-codemod.yml").unlink()
          PY

      - name: Commit bounded result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add live unit label counters"
          git push origin HEAD:fix/master-plan-unit-label-counter
