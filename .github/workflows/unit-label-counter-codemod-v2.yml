name: Unit Label Counter Codemod V2

on:
  push:
    branches:
      - fix/master-plan-unit-label-counter

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/master-plan-unit-label-counter
      - name: Apply exact source patch
        run: python scripts/unit-label-counter-codemod.py
      - name: Remove temporary codemod files
        run: rm scripts/unit-label-counter-codemod.py .github/workflows/unit-label-counter-codemod-v2.yml
      - name: Commit final bounded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire Add Business to live unit label counter"
          git push origin HEAD:fix/master-plan-unit-label-counter
