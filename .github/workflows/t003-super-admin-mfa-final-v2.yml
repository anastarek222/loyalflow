name: T003 Super Admin MFA Final V2
# Trigger after workflow exists on the verification branch.
on:
  push:
    branches: [verify/t003-super-admin-mfa-final-v2]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://verification:verification@127.0.0.1:5432/verification
      AUTH_SECRET: verification-only-root-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prisma
        id: prisma
        continue-on-error: true
        run: pnpm exec prisma generate > .prisma.log 2>&1
      - name: Tests
        id: tests
        continue-on-error: true
        run: pnpm test > .tests.log 2>&1
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck > .typecheck.log 2>&1
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint > .lint.log 2>&1
      - name: Record
        if: always()
        run: |
          {
            echo "source_commit=$(git rev-parse HEAD^)"
            echo "prisma=${{ steps.prisma.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            tail -n 180 .tests.log || true
            tail -n 80 .typecheck.log || true
            tail -n 80 .lint.log || true
          } > .t003-super-admin-mfa-final-v2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .t003-super-admin-mfa-final-v2.txt
          git commit -m "chore(ci): record final MFA gates v2 [skip ci]" || true
          git push
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.prisma.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
