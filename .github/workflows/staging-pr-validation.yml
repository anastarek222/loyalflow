name: Staging PR Validation

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loyalflow_ci?schema=public
      AUTH_SECRET: staging-pr-ci-only-auth-secret-not-for-runtime-0123456789abcdef
      NEXT_PUBLIC_APP_URL: https://loyalflow-gray.vercel.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused subscription entitlement tests
        run: node --import tsx --test tests/subscription-lifecycle.test.ts tests/tc44-subscription-entitlement-enforcement.test.ts tests/tc45-subscription-expansion-parity.test.ts

      - name: Run full tests
        run: pnpm test

      - name: Type-check project
        run: pnpm run typecheck

      - name: Validate workspace boundaries
        run: pnpm run validate:workspace

      - name: Lint project
        run: pnpm run lint

      - name: Build application
        run: pnpm run build

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
