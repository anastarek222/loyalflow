name: Staging PR Validation

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loyalflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loyalflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loyalflow_ci?schema=public
      AUTH_SECRET: staging-pr-ci-only-auth-secret-not-for-runtime-0123456789abcdef
      NEXT_PUBLIC_APP_URL: https://loyalflow-gray.vercel.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect browser smoke scope
        id: browser-smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}..HEAD" > /tmp/loyalflow-pr-files.txt
          if grep -Eq '^(app/|components/|lib/(auth|server/auth)|tests/browser/|playwright\.config\.ts$|\.github/workflows/staging-pr-validation\.yml$)' /tmp/loyalflow-pr-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused subscription entitlement tests
        run: node --import tsx --test tests/subscription-lifecycle.test.ts tests/tc4*.test.ts

      - name: Run full tests
        run: pnpm test

      - name: Type-check project
        run: pnpm run typecheck

      - name: Validate workspace boundaries
        run: pnpm run validate:workspace

      - name: Lint project
        run: pnpm run lint

      - name: Build application
        run: pnpm run build

      - name: Apply disposable browser smoke migrations
        if: steps.browser-smoke.outputs.run == 'true'
        run: pnpm exec prisma migrate deploy

      - name: Install Chromium for browser smoke
        if: steps.browser-smoke.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke
        if: steps.browser-smoke.outputs.run == 'true'
        env:
          LOYALFLOW_ENVIRONMENT: staging
          LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
          LOYALFLOW_STAGING_DATABASE: loyalflow_ci
          LOYALFLOW_STAGING_DATABASE_HOST: 127.0.0.1
          LOYALFLOW_PRODUCTION_DATABASE_HOST: production-db.invalid
          UAT_FIXTURE_PASSWORD: browser-smoke-only-password-2026
          UAT_BASE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          AUTH_URL: http://127.0.0.1:3100
          AUTH_TRUST_HOST: "true"
        run: pnpm exec playwright test tests/browser/pr-smoke.spec.ts --config=playwright.config.ts --project=desktop-chromium

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
