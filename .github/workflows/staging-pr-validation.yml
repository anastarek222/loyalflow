name: Staging PR Validation

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loyalflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loyalflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loyalflow_ci?schema=public
      AUTH_SECRET: staging-pr-ci-only-auth-secret-not-for-runtime-0123456789abcdef
      NEXT_PUBLIC_APP_URL: https://loyalflow-gray.vercel.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect browser smoke scope
        id: browser-smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}..HEAD" > /tmp/loyalflow-pr-files.txt
          if grep -Eq '^(app/|components/|lib/(auth|server/auth)|tests/browser/|playwright\.config\.ts$|\.github/workflows/staging-pr-validation\.yml$)' /tmp/loyalflow-pr-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(app/onboarding/|components/owner-onboarding-wizard\.tsx$|components/onboarding/|lib/onboarding/|scripts/prepare-final-uat-fixtures\.ts$|tests/browser/fixtures\.ts$|tests/browser/owner-onboarding-mobile\.spec\.ts$)' /tmp/loyalflow-pr-files.txt; then
            echo "owner-onboarding=true" >> "$GITHUB_OUTPUT"
          else
            echo "owner-onboarding=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(app/businesses/\[slug\]/(scan|customers|rewards|offers|campaigns|recovery|reports)/|app/(join|card)/|components/(loyalty-card|standard-loyalty-card|customer|scan|reward|offer|public-card)|lib/(loyalty|rewards|offers|server/business/)|scripts/prepare-final-uat-fixtures\.ts$|tests/browser/(fixtures|final-uat-u13\.spec)\.ts$)' /tmp/loyalflow-pr-files.txt; then
            echo "loyalty-core=true" >> "$GITHUB_OUTPUT"
          else
            echo "loyalty-core=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(app/businesses/\[slug\]/(scan|reports)/|app/(join|card)/|components/(loyalty-card|standard-loyalty-card|customer|scan|public-card)|lib/(loyalty|server/business/)|scripts/prepare-final-uat-fixtures\.ts$|tests/browser/(fixtures|final-uat-u13\.spec)\.ts$|playwright\.config\.ts$)' /tmp/loyalflow-pr-files.txt; then
            echo "loyalty-mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "loyalty-mobile=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(app/(api/(businesses/\[slug\]/custom-card-artwork|card-artwork)|businesses/\[slug\]/program/)|components/(custom-card|loyalty-card|standard-card-setup)|lib/(cards/custom-card|server/business/custom-card)|scripts/(cleanup-final-uat-card-artwork|prepare-final-uat-fixtures)\.ts$|tests/browser/(fixtures|pre-final-admin-security\.spec|pilot-custom-card\.spec)\.ts$|tests/(custom-card|pre-final-slice-d-browser-readiness|pilot-custom-card-receipt).*\.test\.ts$|playwright\.config\.ts$)' /tmp/loyalflow-pr-files.txt; then
            echo "custom-card=true" >> "$GITHUB_OUTPUT"
          else
            echo "custom-card=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused subscription entitlement tests
        run: node --import tsx --test tests/subscription-lifecycle.test.ts tests/tc4*.test.ts

      - name: Run full tests
        run: pnpm test

      - name: Type-check project
        run: pnpm run typecheck

      - name: Validate workspace boundaries
        run: pnpm run validate:workspace

      - name: Lint project
        run: pnpm run lint

      - name: Build application
        run: pnpm run build

      - name: Apply disposable browser smoke migrations
        if: steps.browser-smoke.outputs.run == 'true'
        run: pnpm exec prisma migrate deploy

      - name: Install Chromium for browser smoke
        if: steps.browser-smoke.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke
        if: steps.browser-smoke.outputs.run == 'true'
        env:
          LOYALFLOW_ENVIRONMENT: staging
          LOYALFLOW_ALLOW_STAGING_FIXTURE: I_UNDERSTAND_STAGING_FIXTURE
          LOYALFLOW_STAGING_DATABASE: loyalflow_ci
          LOYALFLOW_STAGING_DATABASE_HOST: 127.0.0.1
          LOYALFLOW_PRODUCTION_DATABASE_HOST: production-db.invalid
          UAT_FIXTURE_PASSWORD: browser-smoke-only-password-2026
          UAT_BASE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          AUTH_URL: http://127.0.0.1:3100
          AUTH_TRUST_HOST: "true"
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright test tests/browser/pr-smoke.spec.ts --config=playwright.config.ts --project=desktop-chromium
          if [[ "${{ steps.browser-smoke.outputs.owner-onboarding }}" == "true" ]]; then
            pnpm exec playwright test tests/browser/owner-onboarding-mobile.spec.ts --config=playwright.config.ts --project=owner-onboarding-chromium
          fi
          if [[ "${{ steps.browser-smoke.outputs.loyalty-core }}" == "true" ]]; then
            pnpm exec playwright test tests/browser/final-uat-u13.spec.ts --config=playwright.config.ts --project=desktop-chromium
          fi
          if [[ "${{ steps.browser-smoke.outputs.loyalty-mobile }}" == "true" ]]; then
            pnpm exec playwright test tests/browser/final-uat-u13.spec.ts --config=playwright.config.ts --project=mobile-chromium
          fi
          if [[ "${{ steps.browser-smoke.outputs.custom-card }}" == "true" ]]; then
            pnpm exec playwright test tests/browser/pilot-custom-card.spec.ts --config=playwright.config.ts --project=desktop-chromium
            pnpm exec playwright test tests/browser/pilot-custom-card.spec.ts --config=playwright.config.ts --project=mobile-chromium
          fi

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
