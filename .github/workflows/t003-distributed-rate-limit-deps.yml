name: T003 Distributed Rate Limit Dependency

on:
  push:
    branches:
      - codex/t003-distributed-rate-limit

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm add @upstash/redis
      - run: rm .github/workflows/t003-distributed-rate-limit-deps.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/t003-distributed-rate-limit-deps.yml
          git commit -m "chore(rate-limit): add Upstash Redis client"
          git push

# trigger dependency install
