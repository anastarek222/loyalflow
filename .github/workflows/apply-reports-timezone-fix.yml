name: Apply Reports Timezone Fix

on:
  push:
    branches: [fix/reward-truth-core]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/reward-truth-core

      - name: Wire reports to business-local calendar boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/businesses/[slug]/reports/page.tsx')
          text = path.read_text()

          replacements = [
              ('import {\n  formatUtcDateInput,\n  parseUtcDateInput,\n  parseReportDateRange,\n} from "@/lib/analytics/date-range";', 'import {\n  getReportPresetDateRange,\n  parseReportDateRange,\n} from "@/lib/analytics/date-range";'),
              ('function getReportRange(period: ReportPeriod, now: Date) {\n  const toInput = formatUtcDateInput(now);\n  const from = new Date(now);\n\n  if (period === "7d") {\n    from.setUTCDate(from.getUTCDate() - 6);\n  } else if (period === "30d") {\n    from.setUTCDate(from.getUTCDate() - 29);\n  }\n\n  const fromInput = formatUtcDateInput(from);\n\n  return {\n    fromInput,\n    toInput,\n    from: parseUtcDateInput(fromInput)!,\n    to: parseUtcDateInput(toInput, true)!,\n  };\n}\n\n', ''),
              ('      loyaltyMode: true,\n      currency: true,\n      unitName: true,', '      loyaltyMode: true,\n      currency: true,\n      timezone: true,\n      unitName: true,'),
              ('  const locale = getLanguageLocale(language);\n  const numberFormatter = new Intl.NumberFormat(locale);\n  const dateTimeFormatter = new Intl.DateTimeFormat(locale, {\n    dateStyle: "medium",\n    timeStyle: "short",\n  });', '  const locale = getLanguageLocale(language);\n  const timeZone = business.timezone ?? "UTC";\n  const numberFormatter = new Intl.NumberFormat(locale);\n  const dateTimeFormatter = new Intl.DateTimeFormat(locale, {\n    dateStyle: "medium",\n    timeStyle: "short",\n    timeZone,\n  });'),
              ('  const defaultRange = getReportRange("30d", today);\n  const shortcutRange = requestedPeriod\n    ? getReportRange(requestedPeriod, today)\n    : null;\n\n  let period: ReportPeriod = requestedPeriod ?? "custom";\n  const customRange = parseReportDateRange({\n    from: query.from,\n    to: query.to,\n    now: today,\n  });\n  const selectedRange = shortcutRange ?? customRange ?? defaultRange;\n  if (!shortcutRange && !customRange) period = "30d";\n  const { fromInput, toInput, from: fromDate, to: toDate } = selectedRange;', '  const defaultRange = getReportPresetDateRange("30d", today, timeZone);\n  const shortcutRange = requestedPeriod\n    ? getReportPresetDateRange(requestedPeriod, today, timeZone)\n    : null;\n  const customRange =\n    !requestedPeriod && (query.from || query.to)\n      ? parseReportDateRange({\n          from: query.from,\n          to: query.to,\n          now: today,\n          timeZone,\n        })\n      : null;\n  const period: ReportPeriod = requestedPeriod ?? (customRange ? "custom" : "30d");\n  const selectedRange = shortcutRange ?? customRange ?? defaultRange;\n  const {\n    fromInput,\n    toInput,\n    from: fromDate,\n    to: toDate,\n    toExclusive,\n  } = selectedRange;'),
              ('  const historicalTrends = createHistoricalAnalyticsTrends(\n    {\n      customers: historicalCustomers,\n      loyaltyEarned: historicalEarned,\n      rewardsRedeemed: historicalRedemptions,\n    },\n    fromDate,\n    toDate,\n  );', '  const historicalTrends = createHistoricalAnalyticsTrends(\n    {\n      customers: historicalCustomers,\n      loyaltyEarned: historicalEarned,\n      rewardsRedeemed: historicalRedemptions,\n    },\n    fromDate,\n    toDate,\n    timeZone,\n  );'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement expected once, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          lte_count = text.count('lte: toDate')
          if lte_count != 6:
              raise SystemExit(f'expected six inclusive DB end bounds, got {lte_count}')
          text = text.replace('lte: toDate', 'lt: toExclusive')

          if 'formatUtcDateInput' in text or 'parseUtcDateInput' in text or 'getReportRange(' in text:
              raise SystemExit('legacy UTC report range wiring still present')
          if text.count('lt: toExclusive') != 6:
              raise SystemExit('half-open report DB range count mismatch')

          path.write_text(text)
          PY

          rm .github/workflows/apply-reports-timezone-fix.yml
          git diff --check

      - name: Commit and push reports timezone patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/businesses/[slug]/reports/page.tsx' .github/workflows/apply-reports-timezone-fix.yml
          git commit -m "fix: use business timezone for reports"
          git push origin HEAD:fix/reward-truth-core
