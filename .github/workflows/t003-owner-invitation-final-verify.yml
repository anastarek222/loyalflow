name: T003 Owner Invitation Final Verify

on:
  push:
    branches:
      - verify/t003-owner-invitation-final

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate
        id: generate
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://verification:verification@127.0.0.1:5432/verification
        run: |
          set +e
          pnpm exec prisma generate > .verify-generate.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Tests
        id: tests
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          pnpm test > .verify-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Typecheck
        id: typecheck
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          pnpm typecheck > .verify-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Lint slice
        id: lint
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          pnpm exec eslint \
            app/accept-owner-invitation/actions.ts \
            app/accept-owner-invitation/page.tsx \
            app/businesses/actions.ts \
            app/businesses/page.tsx \
            components/add-business-experience.tsx \
            components/owner-invitation-form.tsx \
            lib/auth/owner-invitation.ts \
            lib/auth/owner-invitation-runtime.ts \
            lib/auth/owner-invitation-email.ts \
            lib/business/creation-input.ts \
            scripts/verify-local-database.ts \
            tests/onboarding-v2.test.ts \
            tests/owner-invitation-lifecycle.test.ts \
            tests/owner-invitation-public-flow.test.ts \
            tests/production-readiness.test.ts \
            > .verify-lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Record evidence
        if: always()
        run: |
          {
            echo "source_commit=6655038f02128bf855355cfa3535fb95d853298c"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "install=${{ steps.install.outcome }}"
            echo "generate=${{ steps.generate.outcome }}"
            echo "generate_exit=${{ steps.generate.outputs.exit_code }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "tests_exit=${{ steps.tests.outputs.exit_code }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "typecheck_exit=${{ steps.typecheck.outputs.exit_code }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "lint_exit=${{ steps.lint.outputs.exit_code }}"
            echo
            echo "=== TEST SUMMARY ==="
            tail -n 16 .verify-tests.log 2>/dev/null || true
            echo
            echo "=== TYPECHECK ==="
            tail -n 30 .verify-typecheck.log 2>/dev/null || true
            echo
            echo "=== LINT ==="
            tail -n 30 .verify-lint.log 2>/dev/null || true
          } > .t003-final-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .t003-final-verify.txt
          git commit -m "chore(ci): record final t003 verification [skip ci]" || true
          git push
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.generate.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
