name: T003 Email Verification Gates

on:
  push:
    branches:
      - verify/t003-email-verification-gates

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prisma generate
        id: prisma
        continue-on-error: true
        run: |
          set +e
          pnpm exec prisma generate > .gate-prisma.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Full tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          pnpm test > .gate-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          pnpm typecheck > .gate-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Full lint
        id: lint
        continue-on-error: true
        run: |
          set +e
          pnpm lint > .gate-lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Record evidence
        if: always()
        run: |
          {
            echo "source_ref=codex/t003-email-verification"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "prisma=${{ steps.prisma.outcome }}"
            echo "prisma_exit=${{ steps.prisma.outputs.exit_code }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "tests_exit=${{ steps.tests.outputs.exit_code }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "typecheck_exit=${{ steps.typecheck.outputs.exit_code }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "lint_exit=${{ steps.lint.outputs.exit_code }}"
            echo
            echo "=== PRISMA ==="
            tail -n 80 .gate-prisma.log 2>/dev/null || true
            echo
            echo "=== TESTS ==="
            tail -n 120 .gate-tests.log 2>/dev/null || true
            echo
            echo "=== TYPECHECK ==="
            tail -n 100 .gate-typecheck.log 2>/dev/null || true
            echo
            echo "=== LINT ==="
            tail -n 100 .gate-lint.log 2>/dev/null || true
          } > .t003-email-verification-gates.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .t003-email-verification-gates.txt
          git commit -m "chore(ci): record email verification gates [skip ci]" || true
          git push
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.prisma.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
