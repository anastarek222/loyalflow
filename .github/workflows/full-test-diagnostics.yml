name: Full Test Diagnostics

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/reward-truth-core'
    name: Capture full test failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loyalflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loyalflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loyalflow_ci?schema=public
      AUTH_SECRET: staging-pr-ci-only-auth-secret-not-for-runtime-0123456789abcdef
      NEXT_PUBLIC_APP_URL: https://loyalflow-gray.vercel.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm run db:validate

      - name: Apply migrations to disposable PostgreSQL
        run: pnpm run db:migrate:deploy

      - name: Capture full test output
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee full-test.log
          status=${PIPESTATUS[0]}
          echo "pnpm_test_exit_code=${status}" | tee -a full-test.log
          exit "${status}"

      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-diagnostics
          path: full-test.log
          if-no-files-found: error
          retention-days: 1
