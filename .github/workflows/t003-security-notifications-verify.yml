name: T003 Security Notifications Verify

on:
  push:
    branches:
      - codex/t003-security-notifications
    paths-ignore:
      - .t003-security-notifications-verify.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: verification-only-root-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Sync reviewed migration manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = '20260809084500_add_security_notification_lifecycle'
          verifier = Path('scripts/verify-local-database.ts')
          text = verifier.read_text()
          if migration not in text:
              anchor = '  "20260809081000_add_super_admin_mfa_lifecycle",\n'
              if anchor not in text:
                  raise SystemExit('MFA migration anchor not found')
              text = text.replace(anchor, anchor + f'  "{migration}",\n', 1)
              verifier.write_text(text)

          readiness = Path('tests/production-readiness.test.ts')
          text = readiness.read_text()
          text = text.replace('assert.equal(committedMigrations.length, 45);', 'assert.equal(committedMigrations.length, 46);', 1)
          if migration not in text:
              anchor = '''  assert.ok(\n    committedMigrations.includes("20260809081000_add_super_admin_mfa_lifecycle"),\n    "Super Admin MFA lifecycle must be part of the reviewed migration history.",\n  );\n'''
              addition = anchor + f'''  assert.ok(\n    committedMigrations.includes("{migration}"),\n    "Security notification lifecycle must be part of the reviewed migration history.",\n  );\n'''
              if anchor not in text:
                  raise SystemExit('Readiness MFA migration anchor not found')
              text = text.replace(anchor, addition, 1)
          readiness.write_text(text)
          PY
          if ! git diff --quiet -- scripts/verify-local-database.ts tests/production-readiness.test.ts; then
            git config user.name loyalflow-verifier
            git config user.email actions@users.noreply.github.com
            git add scripts/verify-local-database.ts tests/production-readiness.test.ts
            git commit -m "test(t003): sync security notification migration manifest"
            git push
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run verification gates
        id: gates
        run: |
          set +e
          pnpm exec prisma generate
          prisma_status=$?
          pnpm test
          tests_status=$?
          pnpm typecheck
          typecheck_status=$?
          pnpm lint
          lint_status=$?
          set -e

          printf 'verification_commit=%s\n' "$GITHUB_SHA" > .t003-security-notifications-verify.txt
          printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .t003-security-notifications-verify.txt
          printf 'prisma=%s\n' "$prisma_status" >> .t003-security-notifications-verify.txt
          printf 'tests=%s\n' "$tests_status" >> .t003-security-notifications-verify.txt
          printf 'typecheck=%s\n' "$typecheck_status" >> .t003-security-notifications-verify.txt
          printf 'lint=%s\n' "$lint_status" >> .t003-security-notifications-verify.txt

          if [ "$prisma_status" -ne 0 ] || [ "$tests_status" -ne 0 ] || [ "$typecheck_status" -ne 0 ] || [ "$lint_status" -ne 0 ]; then
            exit 1
          fi

      - name: Record evidence
        if: always()
        run: |
          if [ ! -f .t003-security-notifications-verify.txt ]; then
            printf 'verification_commit=%s\n' "$GITHUB_SHA" > .t003-security-notifications-verify.txt
            printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .t003-security-notifications-verify.txt
            printf 'gates=not-run\n' >> .t003-security-notifications-verify.txt
          fi
          git config user.name loyalflow-verifier
          git config user.email actions@users.noreply.github.com
          git add .t003-security-notifications-verify.txt
          git commit -m "test(t003): record security notification gate evidence" || true
          git push || true
