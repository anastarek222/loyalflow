name: T003 Owner Invitation Verify

on:
  push:
    branches:
      - codex/t003-owner-invitation-lifecycle

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies without lifecycle scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Full test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm test > .t003-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm typecheck > .t003-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Lint changed slice
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm exec eslint \
            app/accept-owner-invitation/actions.ts \
            app/accept-owner-invitation/page.tsx \
            app/businesses/actions.ts \
            components/owner-invitation-form.tsx \
            lib/auth/owner-invitation.ts \
            lib/auth/owner-invitation-runtime.ts \
            lib/auth/owner-invitation-email.ts \
            lib/business/creation-input.ts \
            tests/onboarding-v2.test.ts \
            tests/owner-invitation-lifecycle.test.ts \
            tests/owner-invitation-public-flow.test.ts \
            > .t003-lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Record verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "install=${{ steps.install.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "tests_exit=${{ steps.tests.outputs.exit_code }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "typecheck_exit=${{ steps.typecheck.outputs.exit_code }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "lint_exit=${{ steps.lint.outputs.exit_code }}"
            echo
            echo "=== TESTS TAIL ==="
            tail -n 160 .t003-tests.log 2>/dev/null || true
            echo
            echo "=== TYPECHECK TAIL ==="
            tail -n 160 .t003-typecheck.log 2>/dev/null || true
            echo
            echo "=== LINT TAIL ==="
            tail -n 80 .t003-lint.log 2>/dev/null || true
          } > .t003-owner-invitation-verify.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .t003-owner-invitation-verify.txt
          git commit -m "chore(ci): record t003 verification [skip ci]" || true
          git push

      - name: Enforce verification gates
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
