name: T003 Owner Invitation Verify

on:
  push:
    branches:
      - codex/t003-owner-invitation-lifecycle

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies without lifecycle scripts
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Full test suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm test

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm typecheck

      - name: Lint changed slice
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          pnpm exec eslint
          app/accept-owner-invitation/actions.ts
          app/accept-owner-invitation/page.tsx
          app/businesses/actions.ts
          components/owner-invitation-form.tsx
          lib/auth/owner-invitation.ts
          lib/auth/owner-invitation-runtime.ts
          lib/auth/owner-invitation-email.ts
          lib/business/creation-input.ts
          tests/onboarding-v2.test.ts
          tests/owner-invitation-lifecycle.test.ts
          tests/owner-invitation-public-flow.test.ts

      - name: Record verification evidence
        if: always()
        run: |
          cat > .t003-owner-invitation-verify.txt <<EOF
          commit=${GITHUB_SHA}
          install=${{ steps.install.outcome }}
          tests=${{ steps.tests.outcome }}
          typecheck=${{ steps.typecheck.outcome }}
          lint=${{ steps.lint.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .t003-owner-invitation-verify.txt
          git commit -m "chore(ci): record t003 verification [skip ci]" || true
          git push

      - name: Enforce verification gates
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
